<script>
"use strict";
/* ==========================================================================================
   BLACKHOLE.IO — CLIENT (browser)
   ------------------------------------------------------------------------------------------
   Simulation lives in sim.js (shared with the server). This file keeps only what touches
   the browser: WebAudio, mouse input, camera, renderer, HUD, and the multiplayer glue.

   Multiplayer is peer-to-peer (PeerJS over WebRTC): the room creator's browser is the
   authoritative host — it runs the exact Game from sim.js, applies guest intents, and
   broadcasts diff snapshots. Guests mirror that state with zero local physics. This makes
   the game fully deployable on any static website (no server needed).

     solo  -> local Game stepped in a fixed-timestep accumulator.
     host  -> same sim, plus guests: intents in, diff snapshots out (PeerHost).
     multi -> no physics here; the mirror (NetworkController) writes interpolated host state.
   ========================================================================================== */
/* ==========================================================================================
   2. AUDIO — everything synthesised at runtime. No files, no network, no libraries.
   ========================================================================================== */
class GameAudio {
  constructor() {
    this.ctx = null;
    this.enabled = true;
    this.ready = false;
    this.lastAbsorb = 0;     // rate-limit so a 40-dust gulp doesn't machine-gun
  }

  /** Must be called from inside a user gesture (browser autoplay policy). */
  unlock() {
    if (this.ready) return;
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    this.ctx = new AC();
    const c = this.ctx;

    this.master = c.createGain();
    this.master.gain.value = 0.9;
    this.master.connect(c.destination);

    // A gentle bus compressor keeps a 30-particle absorb from clipping.
    this.bus = c.createDynamicsCompressor();
    this.bus.threshold.value = -18;
    this.bus.ratio.value = 5;
    this.bus.attack.value = 0.004;
    this.bus.release.value = 0.22;
    this.bus.connect(this.master);

    // Shared noise buffer — generating white noise once and reusing it is far cheaper
    // than allocating a new buffer per sound effect.
    const len = c.sampleRate * 2;
    this.noise = c.createBuffer(1, len, c.sampleRate);
    const d = this.noise.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;

    this.startAmbience();
    this.ready = true;
  }

  get t() { return this.ctx.currentTime; }
  get on() { return this.ready && this.enabled && this.ctx.state === "running"; }

  setEnabled(v) {
    this.enabled = v;
    if (this.ready) this.master.gain.setTargetAtTime(v ? 0.9 : 0, this.t, 0.05);
  }

  /** Two detuned drones + filtered noise wash = the sound of deep space. Very quiet. */
  startAmbience() {
    const c = this.ctx, t = this.t;
    const g = c.createGain(); g.gain.value = 0.0; g.connect(this.bus);
    g.gain.setTargetAtTime(0.06, t, 3);

    [55, 82.5].forEach((f, i) => {
      const o = c.createOscillator();
      o.type = "sine"; o.frequency.value = f * (i ? 1.003 : 1);
      const og = c.createGain(); og.gain.value = i ? 0.35 : 0.5;
      // Slow LFO on gain so the drone breathes instead of sitting still.
      const lfo = c.createOscillator(); lfo.frequency.value = 0.05 + i * 0.03;
      const lg = c.createGain(); lg.gain.value = 0.22;
      lfo.connect(lg); lg.connect(og.gain); lfo.start();
      o.connect(og); og.connect(g); o.start();
    });

    const n = c.createBufferSource();
    n.buffer = this.noise; n.loop = true;
    const nf = c.createBiquadFilter(); nf.type = "lowpass"; nf.frequency.value = 220; nf.Q.value = 0.6;
    const ng = c.createGain(); ng.gain.value = 0.05;
    n.connect(nf); nf.connect(ng); ng.connect(g); n.start();

    this.ambientGain = g;
  }

  /** Distance attenuation from the listener (the local player / death cam). */
  atten(dist, viewRadius) {
    if (dist == null) return 1;
    return clamp(1 - dist / (viewRadius * 1.9), 0, 1);
  }

  /**
   * THE WHOOMP. A downward pitch sweep (the "swallow") layered with a filtered noise
   * thump (the "impact"). Bigger victims -> lower, longer, louder. This mapping is the
   * whole trick: eating dust ticks, eating a planet detonates.
   */
  absorb(victimRadius, dist, viewRadius, isPlayerKill) {
    if (!this.on) return;
    const now = this.t;
    // Rate limit tiny gulps: at most one every 28ms, else a dust field is a buzzsaw.
    if (victimRadius < 8 && now - this.lastAbsorb < 0.028) return;
    this.lastAbsorb = now;

    const c = this.ctx;
    const size = clamp(victimRadius / 60, 0.02, 1.6);        // 0 = speck, 1.6 = big planet
    const vol = this.atten(dist, viewRadius) * (0.16 + size * 0.55) * (isPlayerKill ? 1.5 : 1);
    if (vol < 0.006) return;

    const dur = 0.10 + size * 0.55;
    // Low mass -> high pitch. Inverse map so growth *sounds* like growth.
    const f0 = 480 / (0.35 + size * 1.7);
    const f1 = f0 * 0.28;

    // --- swallow sweep ---
    const o = c.createOscillator();
    o.type = size > 0.5 ? "sine" : "triangle";
    o.frequency.setValueAtTime(f0, now);
    o.frequency.exponentialRampToValueAtTime(Math.max(24, f1), now + dur);
    const og = c.createGain();
    og.gain.setValueAtTime(0.0001, now);
    og.gain.exponentialRampToValueAtTime(vol, now + 0.012);
    og.gain.exponentialRampToValueAtTime(0.0001, now + dur);
    o.connect(og); og.connect(this.bus);
    o.start(now); o.stop(now + dur + 0.05);

    // --- impact thump: noise through a closing lowpass ---
    const n = c.createBufferSource();
    n.buffer = this.noise;
    n.playbackRate.value = rand(0.8, 1.25);
    const nf = c.createBiquadFilter();
    nf.type = "lowpass";
    nf.frequency.setValueAtTime(1400 + 2600 * (1 - size), now);
    nf.frequency.exponentialRampToValueAtTime(120, now + dur * 0.9);
    nf.Q.value = 1.4;
    const ng = c.createGain();
    ng.gain.setValueAtTime(vol * 0.75, now);
    ng.gain.exponentialRampToValueAtTime(0.0001, now + dur * 0.95);
    n.connect(nf); nf.connect(ng); ng.connect(this.bus);
    n.start(now); n.stop(now + dur + 0.05);

    // --- sub-bass body, only for genuinely big meals ---
    if (size > 0.35) {
      const s = c.createOscillator();
      s.type = "sine";
      s.frequency.setValueAtTime(90 * (1 - size * 0.4), now);
      s.frequency.exponentialRampToValueAtTime(28, now + dur * 1.3);
      const sg = c.createGain();
      sg.gain.setValueAtTime(0.0001, now);
      sg.gain.exponentialRampToValueAtTime(vol * 0.9, now + 0.02);
      sg.gain.exponentialRampToValueAtTime(0.0001, now + dur * 1.4);
      s.connect(sg); sg.connect(this.bus);
      s.start(now); s.stop(now + dur * 1.5);
    }
  }

  /** Rising tension sting for the moment a bigger hole locks onto you. */
  danger() {
    if (!this.on) return;
    const c = this.ctx, now = this.t;
    const o = c.createOscillator();
    o.type = "sawtooth";
    o.frequency.setValueAtTime(70, now);
    o.frequency.exponentialRampToValueAtTime(190, now + 0.5);
    const f = c.createBiquadFilter(); f.type = "lowpass"; f.frequency.value = 500;
    const g = c.createGain();
    g.gain.setValueAtTime(0.0001, now);
    g.gain.exponentialRampToValueAtTime(0.11, now + 0.25);
    g.gain.exponentialRampToValueAtTime(0.0001, now + 0.6);
    o.connect(f); f.connect(g); g.connect(this.bus);
    o.start(now); o.stop(now + 0.65);
  }

  /** Death: everything drops an octave and collapses. Ambience ducks out and returns. */
  death() {
    if (!this.on) return;
    const c = this.ctx, now = this.t;

    if (this.ambientGain) {
      this.ambientGain.gain.setTargetAtTime(0.005, now, 0.3);
      this.ambientGain.gain.setTargetAtTime(0.06, now + 3.5, 1.5);
    }

    [220, 164.8, 110].forEach((f, i) => {
      const o = c.createOscillator();
      o.type = "sine";
      o.frequency.setValueAtTime(f, now + i * 0.09);
      o.frequency.exponentialRampToValueAtTime(f * 0.25, now + 2.2);
      const g = c.createGain();
      g.gain.setValueAtTime(0.0001, now + i * 0.09);
      g.gain.exponentialRampToValueAtTime(0.16, now + i * 0.09 + 0.05);
      g.gain.exponentialRampToValueAtTime(0.0001, now + 2.4);
      o.connect(g); g.connect(this.bus);
      o.start(now + i * 0.09); o.stop(now + 2.5);
    });

    const n = c.createBufferSource();
    n.buffer = this.noise;
    const nf = c.createBiquadFilter();
    nf.type = "lowpass";
    nf.frequency.setValueAtTime(3000, now);
    nf.frequency.exponentialRampToValueAtTime(60, now + 1.8);
    const ng = c.createGain();
    ng.gain.setValueAtTime(0.24, now);
    ng.gain.exponentialRampToValueAtTime(0.0001, now + 2.0);
    n.connect(nf); nf.connect(ng); ng.connect(this.bus);
    n.start(now); n.stop(now + 2.1);
  }

  /** Spawn: a short upward bloom. */
  spawn() {
    if (!this.on) return;
    const c = this.ctx, now = this.t;
    const o = c.createOscillator();
    o.type = "sine";
    o.frequency.setValueAtTime(90, now);
    o.frequency.exponentialRampToValueAtTime(420, now + 0.35);
    const g = c.createGain();
    g.gain.setValueAtTime(0.0001, now);
    g.gain.exponentialRampToValueAtTime(0.13, now + 0.06);
    g.gain.exponentialRampToValueAtTime(0.0001, now + 0.5);
    o.connect(g); g.connect(this.bus);
    o.start(now); o.stop(now + 0.55);
  }

  ui() {
    if (!this.on) return;
    const c = this.ctx, now = this.t;
    const o = c.createOscillator(); o.type = "square"; o.frequency.value = 660;
    const g = c.createGain();
    g.gain.setValueAtTime(0.0001, now);
    g.gain.exponentialRampToValueAtTime(0.04, now + 0.006);
    g.gain.exponentialRampToValueAtTime(0.0001, now + 0.09);
    o.connect(g); g.connect(this.bus);
    o.start(now); o.stop(now + 0.1);
  }
}


/* ==========================================================================================

/* ==========================================================================================
   4. CONTROLLERS — where multiplayer plugs in.
   ========================================================================================== */

class LocalMouseController {
  constructor(input, camera) { this.input = input; this.camera = camera; }
  update(player) {
    const p = this.camera.screenToWorld(this.input.mx, this.input.my);
    player.intentX = p.x; player.intentY = p.y;
    // NETCODE HOOK: this is the exact payload to ship upstream each tick:
    //   socket.send({t:'intent', x:p.x, y:p.y})
  }
}

/* ==========================================================================================
   5. INPUT
   ========================================================================================== */
class Input {
  constructor() {
    this.mx = window.innerWidth / 2;
    this.my = window.innerHeight / 2;
    this.moved = false;
    const set = (x, y) => { this.mx = x; this.my = y; this.moved = true; };
    window.addEventListener("mousemove", e => set(e.clientX, e.clientY), { passive: true });
    window.addEventListener("touchstart", e => { const t = e.touches[0]; if (t) set(t.clientX, t.clientY); }, { passive: true });
    window.addEventListener("touchmove",  e => { const t = e.touches[0]; if (t) set(t.clientX, t.clientY); }, { passive: true });
  }
}

/* ==========================================================================================
   6. CAMERA
   ========================================================================================== */
class Camera {
  constructor() {
    this.x = CFG.WORLD.w / 2; this.y = CFG.WORLD.h / 2;
    this.zoom = 1; this.targetZoom = 1;
    this.vw = window.innerWidth; this.vh = window.innerHeight;
    this.shake = 0; this.shx = 0; this.shy = 0;
    this.hard = true;         // hard-follow (playing) vs soft drift (death cam / attract)
  }
  resize(w, h) { this.vw = w; this.vh = h; }

  follow(target, dt) {
    if (!target) return;
    if (this.hard) { this.x = target.x; this.y = target.y; }
    else {          // cinematic lag for the death cam and attract mode
      this.x = damp(this.x, target.x, 2.2, dt);
      this.y = damp(this.y, target.y, 2.2, dt);
    }
    this.targetZoom = clamp(
      CFG.CAMERA.VIEW_REF / (target.r + CFG.CAMERA.VIEW_PAD),
      CFG.CAMERA.MIN_ZOOM, CFG.CAMERA.MAX_ZOOM
    );
    this.zoom = damp(this.zoom, this.targetZoom, CFG.CAMERA.LERP, dt);

    this.shake = Math.max(0, this.shake - dt * 2.4);
    const s = this.shake * this.shake * 13;
    this.shx = rand(-s, s); this.shy = rand(-s, s);
  }
  kick(a) { this.shake = Math.min(1.4, this.shake + a); }

  screenToWorld(sx, sy) {
    return { x: (sx - this.vw / 2) / this.zoom + this.x, y: (sy - this.vh / 2) / this.zoom + this.y };
  }
  get viewRadius() { return Math.max(this.vw, this.vh) / 2 / this.zoom; }
  viewBounds(margin = 200) {
    const hw = this.vw / 2 / this.zoom + margin, hh = this.vh / 2 / this.zoom + margin;
    return { x0: this.x - hw, y0: this.y - hh, x1: this.x + hw, y1: this.y + hh };
  }
}

/* ==========================================================================================
   8. RENDERER
   ========================================================================================== */
class Renderer {
  constructor(canvas, camera) {
    this.canvas = canvas;
    this.ctx = canvas.getContext("2d", { alpha: false });
    this.camera = camera;
    this.dpr = 1;
    this.stars = [];
    this.buildStarfield();
    this.resize();
    window.addEventListener("resize", () => this.resize());
  }

  resize() {
    this.dpr = Math.min(window.devicePixelRatio || 1, 2);   // cap: this scene is fill-rate heavy
    const w = window.innerWidth, h = window.innerHeight;
    this.canvas.width = Math.floor(w * this.dpr);
    this.canvas.height = Math.floor(h * this.dpr);
    this.canvas.style.width = w + "px";
    this.canvas.style.height = h + "px";
    this.camera.resize(w, h);
    this.ctx.setTransform(1, 0, 0, 1, 0, 0);
    this.ctx.fillStyle = "#000";
    this.ctx.fillRect(0, 0, this.canvas.width, this.canvas.height);
  }

  buildStarfield() {
    this.stars = CFG.RENDER.STAR_LAYERS.map(layer => {
      const pts = [], TILE = 2600;
      for (let i = 0; i < layer.count; i++) {
        pts.push({
          x: rand(0, TILE), y: rand(0, TILE),
          s: layer.size * rand(0.5, 1.5),
          a: layer.alpha * rand(0.4, 1),
          tw: rand(0, TAU),
          c: chance(0.86) ? "#ffffff" : pick(["#bcd8ff", "#ffd9bc", "#d8bcff"])
        });
      }
      return { pts, speed: layer.speed, tile: TILE };
    });
  }

  draw(game) {
    const ctx = this.ctx, cam = this.camera;

    // ---- 1. TRAIL FADE: translucent black instead of clearRect => motion blur ----
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.globalCompositeOperation = "source-over";
    ctx.fillStyle = "rgba(2, 2, 8, " + CFG.RENDER.TRAIL_FADE + ")";
    ctx.fillRect(0, 0, this.canvas.width, this.canvas.height);

    // ---- 2. PARALLAX STARFIELD (screen space) ----
    this.drawStars(game.time);

    // ---- 3. WORLD TRANSFORM: screen = (world - cam) * zoom + centre + shake ----
    ctx.setTransform(this.dpr, 0, 0, this.dpr, 0, 0);
    ctx.translate(cam.vw / 2 + cam.shx, cam.vh / 2 + cam.shy);
    ctx.scale(cam.zoom, cam.zoom);
    ctx.translate(-cam.x, -cam.y);

    const vb = cam.viewBounds(260);
    this.drawWorldBounds(ctx);

    ctx.globalCompositeOperation = "lighter";
    for (const e of game.food) {
      if (e.x < vb.x0 || e.x > vb.x1 || e.y < vb.y0 || e.y > vb.y1) continue;
      if (e.type === "dust") this.drawDust(ctx, e, game.time);
    }
    ctx.globalCompositeOperation = "source-over";
    for (const e of game.food) {
      if (e.x < vb.x0 || e.x > vb.x1 || e.y < vb.y0 || e.y > vb.y1) continue;
      if (e.type === "asteroid") this.drawAsteroid(ctx, e);
      else if (e.type === "planet") this.drawPlanet(ctx, e);
    }

    ctx.globalCompositeOperation = "lighter";
    for (const p of game.particles) this.drawParticle(ctx, p);
    ctx.globalCompositeOperation = "source-over";

    const holes = game.players.slice().sort((a, b) => a.r - b.r);   // small first
    for (const p of holes) this.drawBlackHole(ctx, p, game.time);

    ctx.setTransform(this.dpr, 0, 0, this.dpr, 0, 0);
    this.drawVignette(ctx, cam.vw, cam.vh);
    this.drawMinimap(ctx, game);
  }

  /** Depth layers offset by camera * their own speed, wrapped modulo a tile. */
  drawStars(time) {
    const ctx = this.ctx, cam = this.camera;
    ctx.setTransform(this.dpr, 0, 0, this.dpr, 0, 0);
    ctx.globalCompositeOperation = "lighter";

    for (const layer of this.stars) {
      const tile = layer.tile;
      const zk = 0.55 + cam.zoom * 0.45;
      let ox = -(cam.x * layer.speed * zk) % tile;
      let oy = -(cam.y * layer.speed * zk) % tile;
      if (ox > 0) ox -= tile;
      if (oy > 0) oy -= tile;
      const cols = Math.ceil(cam.vw / tile) + 1, rows = Math.ceil(cam.vh / tile) + 1;

      for (let cx = 0; cx <= cols; cx++) {
        for (let cy = 0; cy <= rows; cy++) {
          const bx = ox + cx * tile, by = oy + cy * tile;
          for (let i = 0; i < layer.pts.length; i++) {
            const s = layer.pts[i];
            const x = bx + s.x, y = by + s.y;
            if (x < -4 || x > cam.vw + 4 || y < -4 || y > cam.vh + 4) continue;
            const tw = 0.72 + 0.28 * Math.sin(time * 1.7 + s.tw);
            ctx.globalAlpha = s.a * tw;
            ctx.fillStyle = s.c;
            const sz = s.s * (0.7 + layer.speed);
            ctx.fillRect(x, y, sz, sz);
          }
        }
      }
    }
    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = "source-over";
  }

  drawWorldBounds(ctx) {
    ctx.save();
    ctx.strokeStyle = "rgba(70,120,190,0.30)";
    ctx.lineWidth = 3 / this.camera.zoom;
    ctx.shadowBlur = 26; ctx.shadowColor = "rgba(70,140,255,0.55)";
    ctx.strokeRect(0, 0, CFG.WORLD.w, CFG.WORLD.h);
    ctx.restore();
  }

  drawDust(ctx, e, time) {
    const tw = 0.65 + 0.35 * Math.sin(time * 3.1 + e.twinkle);
    ctx.save();
    ctx.translate(e.x, e.y);
    ctx.rotate(e.stretchAng);                    // long axis points at the singularity
    ctx.scale(e.stretch, 1 / Math.sqrt(e.stretch));   // area-preserving stretch
    ctx.globalAlpha = 0.9 * tw;
    ctx.fillStyle = e.tint;
    ctx.shadowBlur = 12; ctx.shadowColor = e.tint;
    ctx.beginPath(); ctx.arc(0, 0, e.r, 0, TAU); ctx.fill();
    ctx.globalAlpha = 0.28 * tw;
    ctx.beginPath(); ctx.arc(0, 0, e.r * 2.6, 0, TAU); ctx.fill();
    ctx.restore();
    ctx.globalAlpha = 1;
  }

  drawAsteroid(ctx, e) {
    ctx.save();
    ctx.translate(e.x, e.y);
    ctx.rotate(e.stretchAng);
    ctx.scale(e.stretch, 1 / Math.sqrt(e.stretch));
    ctx.rotate(e.angle - e.stretchAng);          // own tumble, under the stretch frame

    const n = e.lumps.length;
    ctx.beginPath();
    for (let i = 0; i <= n; i++) {
      const a = (i % n) / n * TAU, rr = e.r * e.lumps[i % n];
      const x = Math.cos(a) * rr, y = Math.sin(a) * rr;
      if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    }
    ctx.closePath();

    const g = ctx.createRadialGradient(-e.r * 0.35, -e.r * 0.35, e.r * 0.1, 0, 0, e.r * 1.25);
    g.addColorStop(0, "#d8cfc0"); g.addColorStop(0.42, e.tint); g.addColorStop(1, "#14161c");
    ctx.fillStyle = g; ctx.fill();
    ctx.strokeStyle = "rgba(190,210,255,0.20)";
    ctx.lineWidth = Math.max(0.6, e.r * 0.07);
    ctx.stroke();

    if (e.stretch > 1.25) {                      // glows hot while being torn apart
      ctx.globalCompositeOperation = "lighter";
      ctx.globalAlpha = clamp((e.stretch - 1.25) / 2.6, 0, 0.85);
      ctx.strokeStyle = "#ffb06a";
      ctx.shadowBlur = 18; ctx.shadowColor = "#ff8a3a";
      ctx.stroke();
    }
    ctx.restore();
    ctx.globalAlpha = 1;
  }

  drawPlanet(ctx, e) {
    ctx.save();
    ctx.translate(e.x, e.y);
    ctx.rotate(e.stretchAng);
    ctx.scale(e.stretch, 1 / Math.sqrt(e.stretch));

    if (e.hasRing) {
      ctx.save();
      ctx.rotate(e.ringTilt);
      ctx.scale(1, 0.26);
      ctx.strokeStyle = "rgba(220,210,190,0.42)"; ctx.lineWidth = e.r * 0.16;
      ctx.beginPath(); ctx.arc(0, 0, e.r * 1.62, 0, TAU); ctx.stroke();
      ctx.strokeStyle = "rgba(220,210,190,0.20)"; ctx.lineWidth = e.r * 0.07;
      ctx.beginPath(); ctx.arc(0, 0, e.r * 1.92, 0, TAU); ctx.stroke();
      ctx.restore();
    }

    const g = ctx.createRadialGradient(-e.r * 0.4, -e.r * 0.42, e.r * 0.08, 0, 0, e.r * 1.05);
    g.addColorStop(0, e.pal[1]); g.addColorStop(0.5, e.pal[0]); g.addColorStop(1, e.pal[2]);
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(0, 0, e.r, 0, TAU); ctx.fill();

    ctx.save();                                   // latitude bands, clipped to the disc
    ctx.beginPath(); ctx.arc(0, 0, e.r, 0, TAU); ctx.clip();
    ctx.rotate(e.angle);
    ctx.globalAlpha = 0.16; ctx.fillStyle = e.pal[2];
    for (let i = -3; i <= 3; i++) ctx.fillRect(-e.r, i * e.r * 0.3, e.r * 2, e.r * 0.12);
    ctx.restore();

    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = "lighter";     // atmospheric limb glow
    const ag = ctx.createRadialGradient(0, 0, e.r * 0.88, 0, 0, e.r * 1.3);
    ag.addColorStop(0, "rgba(0,0,0,0)");
    ag.addColorStop(0.55, "rgba(150,200,255,0.16)");
    ag.addColorStop(1, "rgba(0,0,0,0)");
    ctx.fillStyle = ag;
    ctx.beginPath(); ctx.arc(0, 0, e.r * 1.3, 0, TAU); ctx.fill();
    ctx.restore();
    ctx.globalCompositeOperation = "source-over";
    ctx.globalAlpha = 1;
  }

  drawParticle(ctx, p) {
    const t = p.life / p.maxLife;
    ctx.globalAlpha = t * t;
    ctx.fillStyle = p.color;
    ctx.shadowBlur = 14; ctx.shadowColor = p.color;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.size * (0.35 + t * 0.65), 0, TAU); ctx.fill();
    ctx.globalAlpha = 1; ctx.shadowBlur = 0;
  }

  /**
   * BLACK HOLE, back to front:
   *   lensing halo -> comet trail -> accretion disk -> photon ring -> event horizon
   *   -> absorb shockwave -> spawn shield -> nameplate
   */
  drawBlackHole(ctx, p, time) {
    const r = p.r;
    const pulse = 1 + 0.055 * Math.sin(p.pulse * 1.6) + 0.03 * Math.sin(p.pulse * 3.7);

    // lensing halo
    ctx.save();
    ctx.globalCompositeOperation = "lighter";
    const haloR = r * 6.2;
    const halo = ctx.createRadialGradient(p.x, p.y, r * 0.9, p.x, p.y, haloR);
    halo.addColorStop(0.00, this.rgba(p.color, 0.30));
    halo.addColorStop(0.16, this.rgba(p.color, 0.13));
    halo.addColorStop(0.45, "rgba(60,90,190,0.055)");
    halo.addColorStop(1.00, "rgba(0,0,0,0)");
    ctx.fillStyle = halo;
    ctx.beginPath(); ctx.arc(p.x, p.y, haloR, 0, TAU); ctx.fill();
    ctx.restore();

    // comet trail
    const tr = p.trail;
    if (tr.length >= 6) {
      ctx.save();
      ctx.globalCompositeOperation = "lighter";
      const pts = tr.length / 2;
      ctx.lineCap = "round"; ctx.strokeStyle = p.color;
      for (let i = 0; i < pts - 1; i++) {
        const a = i / pts;
        ctx.globalAlpha = a * a * 0.30;
        ctx.lineWidth = r * 1.5 * a;
        ctx.beginPath();
        ctx.moveTo(tr[i * 2], tr[i * 2 + 1]);
        ctx.lineTo(tr[i * 2 + 2], tr[i * 2 + 3]);
        ctx.stroke();
      }
      ctx.restore();
    }

    // accretion disk
    ctx.save();
    ctx.translate(p.x, p.y);
    ctx.globalCompositeOperation = "lighter";
    ctx.rotate(p.diskAngle);
    const diskR = r * 2.55 * pulse;
    const disk = ctx.createRadialGradient(0, 0, r * 0.92, 0, 0, diskR);
    disk.addColorStop(0.00, "rgba(255,255,255,0.96)");
    disk.addColorStop(0.13, this.rgba(p.color, 0.92));
    disk.addColorStop(0.38, this.rgba(p.color, 0.42));
    disk.addColorStop(0.70, "rgba(120,70,220,0.16)");
    disk.addColorStop(1.00, "rgba(0,0,0,0)");
    ctx.fillStyle = disk;
    ctx.shadowBlur = clamp(r * 1.6, 18, 40); ctx.shadowColor = p.color;   // cap blur: big holes were fill-rate killers
    ctx.beginPath(); ctx.arc(0, 0, diskR, 0, TAU); ctx.fill();

    ctx.shadowBlur = clamp(r * 0.9, 10, 40);      // Doppler-beamed hot arcs = visible spin
    for (let k = 0; k < 2; k++) {
      const a0 = k * Math.PI + Math.sin(time * 0.7 + k) * 0.25;
      ctx.globalAlpha = 0.42;
      ctx.strokeStyle = k === 0 ? "#ffffff" : p.color;
      ctx.lineWidth = r * 0.30;
      ctx.beginPath(); ctx.arc(0, 0, r * (1.42 + k * 0.34), a0, a0 + 1.15); ctx.stroke();
    }
    ctx.globalAlpha = 1;
    ctx.restore();

    // photon ring
    ctx.save();
    ctx.globalCompositeOperation = "lighter";
    ctx.strokeStyle = "#ffffff"; ctx.globalAlpha = 0.85;
    ctx.lineWidth = Math.max(0.8, r * 0.055);
    ctx.shadowBlur = clamp(r * 1.1, 12, 40); ctx.shadowColor = p.color;
    ctx.beginPath(); ctx.arc(p.x, p.y, r * 1.045, 0, TAU); ctx.stroke();
    ctx.restore();

    // event horizon: painted source-over so it genuinely occludes the additive layers
    ctx.save();
    ctx.globalCompositeOperation = "source-over";
    ctx.fillStyle = "#000000";
    ctx.beginPath(); ctx.arc(p.x, p.y, r, 0, TAU); ctx.fill();
    const inner = ctx.createRadialGradient(p.x, p.y, r * 0.55, p.x, p.y, r);
    inner.addColorStop(0, "rgba(0,0,0,1)"); inner.addColorStop(1, "rgba(12,6,26,1)");
    ctx.fillStyle = inner;
    ctx.beginPath(); ctx.arc(p.x, p.y, r, 0, TAU); ctx.fill();
    ctx.restore();

    // absorb shockwave
    if (p.eatFlash > 0.01) {
      ctx.save();
      ctx.globalCompositeOperation = "lighter";
      const f = 1 - p.eatFlash;
      ctx.globalAlpha = p.eatFlash * 0.7;
      ctx.strokeStyle = "#ffffff";
      ctx.lineWidth = Math.max(1, r * 0.16 * p.eatFlash);
      ctx.shadowBlur = 30; ctx.shadowColor = p.color;
      ctx.beginPath(); ctx.arc(p.x, p.y, r * (1.1 + f * 2.4), 0, TAU); ctx.stroke();
      ctx.restore();
    }

    // spawn shield
    if (p.shield > 0) {
      ctx.save();
      ctx.globalCompositeOperation = "lighter";
      const a = clamp(p.shield / CFG.PLAYER.SPAWN_SHIELD, 0, 1);
      ctx.globalAlpha = 0.22 + 0.30 * a * (0.6 + 0.4 * Math.sin(time * 9));
      ctx.strokeStyle = "#9fd8ff";
      ctx.lineWidth = Math.max(1, r * 0.10);
      ctx.setLineDash([r * 0.55, r * 0.4]);
      ctx.lineDashOffset = -time * r * 1.4;
      ctx.shadowBlur = 22; ctx.shadowColor = "#5aa0ff";
      ctx.beginPath(); ctx.arc(p.x, p.y, r * 2.0, 0, TAU); ctx.stroke();
      ctx.restore();
    }

    // nameplate
    ctx.save();
    const fs = Math.max(11 / this.camera.zoom, r * 0.42);
    ctx.font = "500 " + fs.toFixed(1) + "px ui-monospace, Menlo, monospace";
    ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.globalAlpha = p.isLocal ? 0.95 : 0.6;
    ctx.fillStyle = p.isLocal ? "#ffffff" : "#cfe4ff";
    ctx.shadowBlur = 12; ctx.shadowColor = "#000";
    ctx.fillText(p.name, p.x, p.y + r + fs * 1.25);
    ctx.restore();
    ctx.globalAlpha = 1; ctx.shadowBlur = 0;
  }

  drawVignette(ctx, w, h) {
    const g = ctx.createRadialGradient(w / 2, h / 2, Math.min(w, h) * 0.34, w / 2, h / 2, Math.max(w, h) * 0.78);
    g.addColorStop(0, "rgba(0,0,0,0)");
    g.addColorStop(1, "rgba(0,0,0,0.62)");
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, w, h);
  }

  /** Bottom-right minimap: 5000x5000 is far too big to navigate blind. */
  drawMinimap(ctx, game) {
    const S = 132, pad = 16;
    const x0 = this.camera.vw - S - pad, y0 = this.camera.vh - S - pad;
    const k = S / CFG.WORLD.w;

    ctx.save();
    ctx.globalAlpha = 0.82;
    ctx.fillStyle = "rgba(3,8,16,0.62)";
    ctx.fillRect(x0, y0, S, S);
    ctx.strokeStyle = "rgba(70,120,190,0.42)";
    ctx.lineWidth = 1;
    ctx.strokeRect(x0 + 0.5, y0 + 0.5, S - 1, S - 1);

    for (const e of game.food) {                  // planets only — dust would be mush
      if (e.type !== "planet") continue;
      ctx.fillStyle = "rgba(150,180,220,0.5)";
      ctx.beginPath(); ctx.arc(x0 + e.x * k, y0 + e.y * k, 1.8, 0, TAU); ctx.fill();
    }
    for (const p of game.players) {
      const isMe = p.isLocal;
      ctx.fillStyle = isMe ? "#ffb45e" : p.color;
      ctx.globalAlpha = isMe ? 1 : 0.75;
      ctx.beginPath();
      ctx.arc(x0 + p.x * k, y0 + p.y * k, clamp(p.r * k * 2.2, 1.6, 5), 0, TAU);
      ctx.fill();
    }

    ctx.globalAlpha = 0.55;                        // viewport rectangle
    const vb = this.camera.viewBounds(0);
    ctx.strokeStyle = "#ffffff"; ctx.lineWidth = 1;
    ctx.strokeRect(x0 + vb.x0 * k, y0 + vb.y0 * k, (vb.x1 - vb.x0) * k, (vb.y1 - vb.y0) * k);
    ctx.restore();
    ctx.globalAlpha = 1;
  }

  rgba(hex, a) {
    const n = parseInt(hex.slice(1), 16);
    return "rgba(" + ((n >> 16) & 255) + "," + ((n >> 8) & 255) + "," + (n & 255) + "," + a + ")";
  }
}



/* ==========================================================================================
   9. HUD
   ========================================================================================== */
class HUD {
  constructor() {
    const $ = id => document.getElementById(id);
    this.mass = $("ui-mass"); this.x = $("ui-x"); this.y = $("ui-y");
    this.fps = $("ui-fps"); this.ent = $("ui-ent");
    this.time = $("ui-time"); this.eaten = $("ui-eaten");
    this.board = $("ui-board"); this.feed = $("feed");
    this.acc = 0; this.lastFeed = 0;
  }

  update(game, fps, dt) {
    this.acc += dt;
    if (this.acc < 0.1) return;                    // throttle DOM writes to 10Hz
    this.acc = 0;

    const me = game.local;
    const live = me && game.state === "playing";
    this.mass.textContent = me ? fmt(live ? me.mass : me.peakMass) : "0";
    this.x.textContent = me ? Math.round(me.x) : 0;
    this.y.textContent = me ? Math.round(me.y) : 0;
    this.fps.textContent = Math.round(fps);
    this.ent.textContent = game.food.length + game.players.length + game.particles.length;
    this.time.textContent = live ? mmss(game.time - me.spawnTime) : "0:00";
    this.eaten.textContent = me ? me.absorbed : 0;

    const top = (game.ranked || game.players).slice(0, 7);
    this.board.innerHTML = top.map((p, i) =>
      '<div class="' + (p.isLocal ? "me" : "") + '">' + (i + 1) + ". " + esc(p.name) + " &nbsp;" + fmt(p.mass) + "</div>"
    ).join("");

    if (game.feed.length !== this.lastFeed) {
      this.lastFeed = game.feed.length;
      this.feed.innerHTML = game.feed.map(f =>
        '<div class="' + (f.mine ? "mine" : "") + '">' +
        '<span class="ate">' + esc(f.a) + '</span> devoured ' +
        '<span class="victim">' + esc(f.b) + '</span></div>'
      ).join("");
    }
  }
}
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

/* ==========================================================================================
   10. NETWORK CONTROLLER — client mirror + interpolation
   ------------------------------------------------------------------------------------------
   In multiplayer the authoritative Game lives on the server. This controller maintains a
   MIRROR Game on the client: it merges the per-client diff snapshots into a small buffer,
   interpolates between the two snapshots bracketing "now - 100ms", and writes the result
   into persistent Entity instances the existing Renderer already knows how to draw.

   It mirrors the controller seam: HumanlikeController.update(player) writes intent, this
   update(game) writes positions. No physics runs client-side — the only locally stepped
   things are cosmetic particles and the local mouse -> intent point.
   ========================================================================================== */
class NetworkController {
  constructor(game, name) {
    this.game = game;
    this.name = name;
    this.ws = null;
    this.myId = 0;
    this.room = null;
    this.connected = false;
    this.dead = false;
    this.failed = null;
    this.closed = false;
    this.mySpawnTime = 0;

    this.buffer = [];               // [{ t: clientMs, serverTime, state: Map<id, plainState> }]
    this.current = new Map();       // latest full state
    this.entities = new Map();      // id -> mirror Entity instance
    this.lastIntentAt = 0;

    this.onjoined = null;
    this.onerror = null;
    this.ondisconnect = null;
  }

  /** P2P transport: `transport` is a PeerSocket wrapping a PeerJS data connection. */
  connectPeer(transport, roomCode) {
    this.closed = false;
    this.ws = transport;
    transport.onopen = () => {
      try { transport.send(JSON.stringify({ t: "join", room: roomCode || null, name: this.name })); } catch (e) {}
    };
    transport.onmessage = e => {
      let msg;
      try { msg = JSON.parse(e.data); } catch (err) { return; }
      this.onMessage(msg);
    };
    transport.onclose = () => this.onClose();
    transport.onerror = () => {};
    if (transport.readyState === 1 && transport.onopen) transport.onopen();   // conn already open
  }

  onMessage(msg) {
    if (msg.t === "joined") {
      this.myId = msg.id;
      this.room = msg.room;
      this.mySpawnTime = msg.spawnTime || 0;
      this.connected = true;
      this.dead = false;
      this.game.clearEntities();
      this.entities.clear();
      this.current.clear();
      this.buffer.length = 0;
      this.game.state = "playing";
      if (this.onjoined) this.onjoined();
    } else if (msg.t === "s") {
      const now = performance.now();
      const merged = new Map(this.current);
      for (const a of msg.p || []) merged.set(a[0], decodePlayer(a));
      for (const a of msg.f || []) merged.set(a[0], decodeFood(a));
      for (const id of msg.d || []) merged.delete(id);
      this.current = merged;
      this.buffer.push({ t: now, serverTime: msg.time, state: merged });
      if (this.buffer.length > 90) this.buffer.shift();
    } else if (msg.t === "e") {
      this.onEvent(msg);
    } else if (msg.t === "err") {
      this.failed = msg.code;
    }
  }

  onEvent(msg) {
    const g = this.game;
    if (msg.kind === "absorb") {
      const hole = this.entities.get(msg.holeId) || null;
      const tint = msg.tint || "#fff";
      g.events.push({
        type: "absorb", x: msg.x, y: msg.y, r: msg.r, hole,
        victim: { type: msg.isPlayer ? "player" : "food", r: msg.r, tint, color: tint }
      });
    } else if (msg.kind === "kill") {
      g.feed.unshift({ a: msg.a, b: msg.b, mine: msg.mine, victimIsMe: msg.victimIsMe, t: 6 });
      if (g.feed.length > 6) g.feed.length = 6;
    } else if (msg.kind === "death") {
      this.dead = true;
      g.state = "dead";
      g.deathInfo = { killer: msg.killer, peakMass: msg.peakMass, rank: msg.rank, time: msg.time, absorbed: msg.absorbed };
      g.deathCam = msg.killerId ? (this.entities.get(msg.killerId) || null) : null;
      g.events.push({ type: "death", hole: this.entities.get(this.myId) || null, killer: g.deathCam });
    } else if (msg.kind === "spawn") {
      this.dead = false;
      this.mySpawnTime = msg.spawnTime || 0;
      g.state = "playing";
      g.deathInfo = null;
      g.deathCam = null;
      g.events.push({ type: "spawn", hole: this.entities.get(this.myId) || null });
    }
  }

  onClose() {
    if (this.closed) return;                 // intentional close() — no error to report
    const wasLive = this.connected || !!this.room;
    this.connected = false;
    this.room = null;
    if (this.failed) {
      const code = this.failed;
      this.failed = null;
      if (this.onerror) this.onerror(code);  // server sent {t:"err"} (full / invalid)
    } else if (wasLive && this.ondisconnect) {
      this.ondisconnect();                   // dropped mid-game
    } else if (this.onerror) {
      this.onerror("connect");              // socket died before we ever joined a room
    }
  }

  sendIntent(x, y) {
    if (!this.ws || this.ws.readyState !== 1) return;
    if (this.dead || this.game.state !== "playing") return;
    const now = performance.now();
    if (now - this.lastIntentAt < 33) return;
    this.lastIntentAt = now;
    this.ws.send(JSON.stringify({ t: "intent", x: Math.round(x), y: Math.round(y) }));
  }

  respawn() {
    if (this.ws && this.ws.readyState === 1) this.ws.send(JSON.stringify({ t: "respawn" }));
  }

  close() {
    this.closed = true;
    this.connected = false;
    this.room = null;
    if (this.ws) { try { this.ws.close(); } catch (err) {} this.ws = null; }
    this.entities.clear();
    this.current.clear();
    this.buffer.length = 0;
    this.myId = 0;
  }

  /** Interpolate the snapshot buffer and write the result into the mirror Game. */
  update() {
    const g = this.game;
    if (this.buffer.length === 0) return;

    const now = performance.now();
    const target = now - 100;                       // render 100ms in the past => always bracketed
    let a = this.buffer[0], b = this.buffer[this.buffer.length - 1];
    for (const s of this.buffer) {
      if (s.t <= target) a = s; else { b = s; break; }
    }
    const span = Math.max(1, b.t - a.t);
    const alpha = clamp((target - a.t) / span, 0, 1);

    g.food.length = 0;
    g.players.length = 0;
    const seen = new Set();

    for (const [id, nstate] of b.state) {
      const pstate = a.state.get(id);
      const s = mixStates(pstate, nstate, alpha);
      seen.add(id);
      let e = this.entities.get(id);
      if (!e) {
        e = makeMirrorEntity(s);
        e.id = id;
        this.entities.set(id, e);
      }
      writeMirrorState(e, s);
      if (s.kind === "player") {
        e.isLocal = id === this.myId;
        if (e.isLocal) {
          e.trail.push(e.x, e.y);                  // comet trail is cosmetic; no physics here
          while (e.trail.length > 52) e.trail.splice(0, 2);
        }
        g.players.push(e);
      } else {
        g.food.push(e);
      }
    }

    for (const [id] of this.entities) {
      if (!seen.has(id)) this.entities.delete(id);
    }

    const local = this.myId ? (this.entities.get(this.myId) || null) : null;
    g.local = this.dead ? null : local;
    if (g.local) g.local.spawnTime = this.mySpawnTime;

    g.time = lerp(a.serverTime, b.serverTime, alpha);
    g.ranked = g.players.slice().sort((x, y) => y.mass - x.mass);

    if (g.deathCam && !this.entities.has(g.deathCam.id)) g.deathCam = null;
  }
}

/** Interpolate numeric fields between two plain snapshot states (strings/arrays from B). */
function mixStates(A, B, k) {
  const out = Object.assign({}, B);
  if (!A) return out;
  out.x = lerp(A.x, B.x, k);
  out.y = lerp(A.y, B.y, k);
  out.r = lerp(A.r, B.r, k);
  out.stretch = lerp(A.stretch == null ? 1 : A.stretch, B.stretch == null ? 1 : B.stretch, k);
  out.stretchAng = lerp(A.stretchAng == null ? 0 : A.stretchAng, B.stretchAng == null ? 0 : B.stretchAng, k);
  out.angle = lerp(A.angle == null ? 0 : A.angle, B.angle == null ? 0 : B.angle, k);
  out.diskAngle = lerp(A.diskAngle == null ? 0 : A.diskAngle, B.diskAngle == null ? 0 : B.diskAngle, k);
  out.pulse = lerp(A.pulse == null ? 0 : A.pulse, B.pulse == null ? 0 : B.pulse, k);
  out.eatFlash = lerp(A.eatFlash == null ? 0 : A.eatFlash, B.eatFlash == null ? 0 : B.eatFlash, k);
  out.shield = lerp(A.shield == null ? 0 : A.shield, B.shield == null ? 0 : B.shield, k);
  return out;
}

function makeMirrorEntity(s) {
  if (s.kind === "player") {
    const p = new Player(s.x, s.y, s.name || "", s.color || "#fff");
    p.isBot = !!s.isBot;
    return p;
  }
  if (s.kind === "dust") return new Dust(s.x, s.y);
  if (s.kind === "asteroid") return new Asteroid(s.x, s.y);
  return new Planet(s.x, s.y);
}

function writeMirrorState(e, s) {
  e.x = s.x; e.y = s.y; e.r = s.r;
  e.mass = massFromRadius(s.r);
  e.stretch = s.stretch;
  e.stretchAng = s.stretchAng;
  if (s.angle !== undefined) e.angle = s.angle;
  if (s.tint !== undefined) e.tint = s.tint;
  if (s.color !== undefined) e.color = s.color;
  if (s.name !== undefined) e.name = s.name;
  if (e.type === "player") {
    e.diskAngle = s.diskAngle == null ? 0 : s.diskAngle;
    e.pulse = s.pulse == null ? 0 : s.pulse;
    e.eatFlash = s.eatFlash == null ? 0 : s.eatFlash;
    e.shield = s.shield == null ? 0 : s.shield;
    e.isBot = !!s.isBot;
  }
  if (s.hasRing !== undefined) e.hasRing = s.hasRing;
  if (s.ringTilt !== undefined) e.ringTilt = s.ringTilt;
  if (s.pal !== undefined) e.pal = s.pal;
  if (s.lumps !== undefined) e.lumps = s.lumps;
}


/* ==========================================================================================
   11. PEER-TO-PEER MULTIPLAYER
   ------------------------------------------------------------------------------------------
   No server needed: PeerJS (free public signaling) connects the two browsers over a WebRTC
   data channel. The room creator's browser becomes the authoritative HOST — it runs the
   exact Game from sim.js, applies guest intents, and broadcasts diff snapshots using the
   same wire format server.js uses, so a guest can't tell the difference.
   ========================================================================================== */

const MAX_PLAYERS = 16;                    // bots + host + guests
const PEER_PREFIX = "bh-";

function genRoomCode() {
  const chars = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";   // no I/O/0/1 — codes stay readable
  let c = "";
  for (let i = 0; i < 5; i++) c += chars[(Math.random() * chars.length) | 0];
  return c;
}

function sanitizePeerName(raw) {
  return String(raw || "").replace(/[|<>]/g, "").trim().toUpperCase().slice(0, 12) || "PLAYER";
}

/** Wraps a PeerJS data connection so NetworkController can treat it like a socket. */
class PeerSocket {
  constructor(conn) {
    this.conn = conn;
    this.readyState = 0;                   // 0 connecting, 1 open, 3 closed
    this.onopen = this.onmessage = this.onclose = this.onerror = null;
    conn.on("open", () => { this.readyState = 1; if (this.onopen) this.onopen(); });
    conn.on("data", d => {
      if (!this.onmessage) return;
      let str;
      try { str = typeof d === "string" ? d : JSON.stringify(d); } catch (e) { str = String(d); }
      this.onmessage({ data: str });
    });
    conn.on("close", () => { this.readyState = 3; if (this.onclose) this.onclose(); });
    conn.on("error", () => { if (this.onerror) this.onerror(); });
    if (conn.open) this.readyState = 1;
  }
  send(str) { if (this.conn && this.conn.open) { try { this.conn.send(str); } catch (e) {} } }
  close() { try { if (this.conn) this.conn.close(); } catch (e) {} }
}

/** The room creator's browser: authoritative sim host (port of server.js Room). */
class PeerHost {
  constructor(game, name, onReady, onError) {
    this.game = game;
    this.name = name;
    this.onReady = onReady;                // (roomCode) => {}
    this.onError = onError;                // (code) => {}
    this.peer = null;
    this.roomCode = null;
    this.members = new Map();              // conn -> { player, name, dead, last:{p:Map,f:Map} }
    this.closed = false;
    this.retry = 0;
  }

  createRoom() {
    const attempt = () => {
      if (this.closed) return;
      const code = genRoomCode();
      const peer = new Peer(PEER_PREFIX + code, { debug: 0 });
      this.peer = peer;
      peer.on("open", () => { this.roomCode = code; if (this.onReady) this.onReady(code); });
      peer.on("connection", conn => this.onConnection(conn));
      peer.on("error", err => {
        if (err && err.type === "unavailable-id" && this.retry++ < 8) {
          try { peer.destroy(); } catch (e) {}
          attempt();
        } else if (!this.closed) {
          this.close();
          if (this.onError) this.onError("connect");
        }
      });
      peer.on("disconnected", () => { if (!this.closed && !peer.destroyed) peer.reconnect(); });
    };
    attempt();
  }

  onConnection(conn) {
    conn.on("data", data => {
      let msg;
      try { msg = typeof data === "string" ? JSON.parse(data) : data; } catch (e) { return; }
      if (msg.t === "join") {
        this.addMember(conn, msg.name);
      } else if (msg.t === "intent") {
        const m = this.members.get(conn);
        if (m && !m.dead && m.player.controller) {
          m.player.controller.x = Number(msg.x) || 0;
          m.player.controller.y = Number(msg.y) || 0;
        }
      } else if (msg.t === "respawn") {
        this.respawn(conn);
      }
    });
    conn.on("close", () => this.removeMember(conn));
  }

  addMember(conn, rawName) {
    const name = sanitizePeerName(rawName);
    if (this.game.players.length >= MAX_PLAYERS) {
      this.send(conn, { t: "err", code: "full" });
      try { conn.close(); } catch (e) {}
      return;
    }
    const taken = new Set([...this.members.values()].map(m => m.name));
    let unique = name, n = 2;
    while (taken.has(unique)) unique = name + n++;

    const spot = this.game.safeSpawn(null);
    const player = new Player(spot.x, spot.y, unique, HUES[(this.members.size + 1) % HUES.length]);
    player.controller = new RemoteIntentController(spot.x, spot.y);
    player.spawnTime = this.game.time;
    player.shield = CFG.PLAYER.SPAWN_SHIELD;
    this.game.players.push(player);
    this.members.set(conn, { player, name: unique, dead: false, last: { p: new Map(), f: new Map() } });
    this.send(conn, { t: "joined", id: player.id, room: this.roomCode, spawnTime: player.spawnTime });
    this.game.events.push({ type: "spawn", hole: player });
  }

  removeMember(conn) {
    const m = this.members.get(conn);
    if (!m) return;
    this.members.delete(conn);
    if (m.player) m.player.dead = true;    // compact() drops it next step
  }

  respawn(conn) {
    const m = this.members.get(conn);
    if (!m || !m.dead) return;
    const spot = this.game.safeSpawn(m.player);
    m.player.reset(spot.x, spot.y);        // id stays stable across deaths
    m.player.spawnTime = this.game.time;
    m.dead = false;
    if (!this.game.players.includes(m.player)) this.game.players.push(m.player);
    this.game.events.push({ type: "spawn", hole: m.player });
  }

  /** After each sim step: forward events to guests, then send per-guest diff snapshots.
      game.events is NOT cleared here — the frame loop drains it for the host's own audio. */
  broadcast() {
    this.forwardEvents();
    const game = this.game;
    const time = game.time;

    for (const [conn, m] of this.members) {
      const p = [], f = [], d = [];
      const seenP = new Set(), seenF = new Set();

      for (const pl of game.players) {
        if (pl.dead) continue;
        seenP.add(pl.id);
        const enc = encodePlayer(pl);
        const key = enc.join("|");
        if (m.last.p.get(pl.id) !== key) { m.last.p.set(pl.id, key); p.push(enc); }
      }
      for (const id of m.last.p.keys()) if (!seenP.has(id)) { m.last.p.delete(id); d.push(id); }

      for (const fd of game.food) {
        if (fd.dead) continue;
        seenF.add(fd.id);
        const enc = encodeFood(fd);
        const key = enc.join("|");
        if (m.last.f.get(fd.id) !== key) { m.last.f.set(fd.id, key); f.push(enc); }
      }
      for (const id of m.last.f.keys()) if (!seenF.has(id)) { m.last.f.delete(id); d.push(id); }

      this.send(conn, { t: "s", time, p, f, d });
    }
  }

  forwardEvents() {
    const game = this.game;
    for (const ev of game.events) {
      if (ev.type === "absorb") {
        const isPlayer = ev.victim.type === "player";
        this.broadcastMsg({
          t: "e", kind: "absorb",
          x: Math.round(ev.x), y: Math.round(ev.y), r: Math.round(ev.r),
          tint: ev.victim.color || ev.victim.tint, isPlayer,
          holeId: ev.hole.id, victimId: ev.victim.id
        });
        if (isPlayer) {
          for (const [conn, m] of this.members) {
            const mine = m.player === ev.hole;
            const victimIsMe = m.player === ev.victim;
            this.send(conn, { t: "e", kind: "kill", a: ev.hole.name, b: ev.victim.name, mine, victimIsMe });
            if (victimIsMe) {
              m.dead = true;
              const rank = game.rankOf(m.player);   // post-compact: counts survivors heavier than us
              m.player.bestRank = Math.min(m.player.bestRank, rank);
              this.send(conn, {
                t: "e", kind: "death",
                killer: ev.hole.name, killerId: ev.hole.id,
                rank: m.player.bestRank, peakMass: m.player.peakMass,
                time: game.time - m.player.spawnTime, absorbed: m.player.absorbed
              });
            }
          }
        }
      } else if (ev.type === "spawn") {
        for (const [conn, m] of this.members) {
          if (m.player === ev.hole) this.send(conn, { t: "e", kind: "spawn", spawnTime: ev.hole.spawnTime });
        }
      }
    }
  }

  broadcastMsg(obj) { for (const conn of this.members.keys()) this.send(conn, obj); }

  send(conn, obj) { if (conn && conn.open) { try { conn.send(JSON.stringify(obj)); } catch (e) {} } }

  close() {
    this.closed = true;
    for (const conn of this.members.keys()) { try { conn.close(); } catch (e) {} }
    this.members.clear();
    if (this.peer) { try { this.peer.destroy(); } catch (e) {} this.peer = null; }
    this.roomCode = null;
  }
}


/* ==========================================================================================
   12. BOOTSTRAP + MAIN LOOP
   ========================================================================================== */
(function main() {
  const $ = id => document.getElementById(id);
  const canvas = $("game");
  const camera = new Camera();
  const input = new Input();
  const renderer = new Renderer(canvas, camera);
  const hud = new HUD();
  const audio = new GameAudio();

  const game = new Game(audio);
  const localController = new LocalMouseController(input, camera);

  const menuEl = $("menu"), deathEl = $("death"), nameEl = $("name"),
        roomEl = $("room"), statusEl = $("status"), soundEl = $("sound"),
        roomtagEl = $("roomtag"), roomCodeEl = $("room-code");

  let net = null;      // NetworkController (guest mirror) while joined to a room
  let host = null;     // PeerHost while this tab is the room creator
  let mode = "solo";   // solo | host | multi

  const attractTarget = () => (game.ranked && game.ranked[0]) || game.players[0];

  function setStatus(text, isError) {
    statusEl.textContent = text || "";
    statusEl.classList.toggle("err", !!isError);
  }

  function showRoom(code) {
    roomCodeEl.textContent = code;
    roomtagEl.classList.remove("gone");
  }
  function hideRoom() { roomtagEl.classList.add("gone"); }

  function playerName() {
    return (nameEl.value || "").trim().toUpperCase().slice(0, 12) || "YOU";
  }

  // Solo attract mode: park the camera on the biggest hole so the menu sits over live gameplay.
  function enterSolo() {
    mode = "solo";
    if (host) { host.close(); host = null; }
    if (net) { net.close(); net = null; }
    hideRoom();
    game.clearEntities();
    game.init();
    game.state = "menu";
    camera.hard = false;
    const a0 = attractTarget();
    if (a0) { camera.x = a0.x; camera.y = a0.y; }
  }

  enterSolo();

  function startSolo() {
    audio.unlock();
    audio.ui();
    menuEl.classList.add("gone");
    deathEl.classList.add("gone");
    camera.hard = true;
    game.spawnLocal(playerName(), localController);
    camera.x = game.local.x; camera.y = game.local.y;
    setStatus("");
  }

  // ---- CREATE ROOM: this tab becomes the authoritative host (peer-to-peer). ----
  function startHost() {
    audio.unlock();
    audio.ui();
    const name = playerName();
    if (typeof Peer === "undefined") {
      setStatus("MULTIPLAYER NEEDS INTERNET — PEERJS NOT LOADED", true);
      return;
    }
    if (host) host.close();
    if (net) { net.close(); net = null; }
    setStatus("CREATING ROOM...", false);

    host = new PeerHost(game, name, code => {
      // Host game: authoritative sim with bots + our local hole (mouse-driven).
      game.clearEntities();
      game.init();                              // food + bots fill the empty room
      const spot = game.safeSpawn(null);
      const me = new Player(spot.x, spot.y, name, "#ffb45e");
      me.isLocal = true;
      me.controller = localController;
      me.spawnTime = game.time;
      game.players.push(me);
      game.local = me;
      game.state = "playing";
      mode = "host";
      menuEl.classList.add("gone");
      deathEl.classList.add("gone");
      camera.hard = true;
      showRoom(code);
      setStatus("");
    }, code => {
      setStatus(code === "connect" ? "COULD NOT CREATE ROOM — CHECK INTERNET" : "ROOM ERROR", true);
      enterSolo();
      menuEl.classList.remove("gone");
    });
    host.createRoom();
  }

  // ---- JOIN ROOM: guest mirror (NetworkController) over a PeerJS data channel. ----
  function joinPeerRoom(code) {
    audio.unlock();
    audio.ui();
    const name = playerName();
    if (typeof Peer === "undefined") {
      setStatus("MULTIPLAYER NEEDS INTERNET — PEERJS NOT LOADED", true);
      return;
    }
    setStatus("JOINING ROOM...", false);

    const peer = new Peer({ debug: 0 });
    let done = false;
    const fail = text => {
      if (done) return;
      done = true;
      setStatus(text, true);
      try { peer.destroy(); } catch (e) {}
      enterSolo();
      menuEl.classList.remove("gone");
    };
    peer.on("error", err => {
      if (err && err.type === "peer-unavailable") fail("NO SUCH ROOM — CHECK THE CODE");
      else if (!done) fail("CAN'T REACH ROOM — CHECK INTERNET");
    });
    peer.on("open", () => {
      const conn = peer.connect(PEER_PREFIX + code, { reliable: true });
      conn.on("error", () => { if (!done) fail("CAN'T REACH ROOM — CHECK INTERNET"); });
      conn.on("open", () => {
        if (done) return;
        net = new NetworkController(game, name);
        net.onjoined = () => {
          done = true;
          mode = "multi";
          menuEl.classList.add("gone");
          deathEl.classList.add("gone");
          camera.hard = true;
          showRoom(net.room);
          setStatus("");
        };
        net.onerror = c => {
          const text = c === "full" ? "ROOM FULL"
            : c === "invalid" ? "NO SUCH ROOM"
            : "CONNECTION FAILED";
          setStatus(text, true);
          enterSolo();
          menuEl.classList.remove("gone");
        };
        net.ondisconnect = () => {
          setStatus("HOST LEFT — BACK TO SOLO", true);
          enterSolo();
          menuEl.classList.remove("gone");
        };
        net.connectPeer(new PeerSocket(conn), code);
      });
    });
  }

  function respawnOrRestart() {
    if (mode === "host" && host) startSolo();          // host respawns its own local hole
    else if (net && net.connected) net.respawn();      // guest asks the host to respawn
    else startSolo();
  }

  function joinFromInput() {
    const code = (roomEl.value || "").trim().toUpperCase().slice(0, 6);
    if (!code) { setStatus("ENTER A ROOM CODE", true); return; }
    joinPeerRoom(code);
  }

  $("play").addEventListener("click", startSolo);
  $("create").addEventListener("click", startHost);
  $("join").addEventListener("click", joinFromInput);
  $("respawn").addEventListener("click", respawnOrRestart);
  roomEl.addEventListener("keydown", e => { if (e.key === "Enter") joinFromInput(); });
  nameEl.addEventListener("keydown", e => { if (e.key === "Enter") startSolo(); });
  window.addEventListener("keydown", e => {
    if ((e.code === "Space" || e.code === "Enter") && game.state === "dead") { e.preventDefault(); respawnOrRestart(); }
  });

  roomtagEl.addEventListener("click", () => {
    const code = (net && net.room) || (host && host.roomCode);
    if (code && navigator.clipboard) {
      navigator.clipboard.writeText(code).catch(() => {});
      setStatus("ROOM CODE COPIED", false);
    }
  });

  soundEl.addEventListener("click", () => {
    audio.unlock();
    const on = !audio.enabled;
    audio.setEnabled(on);
    soundEl.textContent = on ? "SOUND ON" : "SOUND OFF";
    soundEl.classList.toggle("off", !on);
    if (on) audio.ui();
  });

  // Pause when the tab is hidden so we don't burn CPU or bank up a huge dt.
  let hidden = false;
  document.addEventListener("visibilitychange", () => {
    hidden = document.hidden;
    if (!hidden) last = performance.now();
  });

  function showDeath() {
    const d = game.deathInfo;
    $("d-killer").textContent = d.killer;
    $("d-mass").textContent = fmt(d.peakMass);
    $("d-rank").textContent = "#" + (d.rank === 99 ? "—" : d.rank);
    $("d-time").textContent = mmss(d.time);
    $("d-eaten").textContent = d.absorbed;
    deathEl.classList.remove("gone");
  }

  // ---------------- Fixed-timestep loop ----------------
  // Solo: the sim advances in FIXED_DT chunks (same model the authoritative server uses).
  // Multi: no sim steps — the NetworkController writes interpolated server state instead.
  let acc = 0, last = performance.now();
  let fps = 60, fpsAcc = 0, fpsFrames = 0;
  let deathDelay = 0;

  function frame(now) {
    requestAnimationFrame(frame);
    let dt = (now - last) / 1000;
    last = now;
    if (hidden || !isFinite(dt) || dt <= 0) return;
    dt = Math.min(dt, CFG.PHYSICS.MAX_FRAME_DT);

    fpsAcc += dt; fpsFrames++;
    if (fpsAcc >= 0.25) { fps = fpsFrames / fpsAcc; fpsAcc = 0; fpsFrames = 0; }

    // --- SIMULATE ---
    if (mode === "solo") {
      acc += dt;
      let steps = 0;
      while (acc >= CFG.PHYSICS.FIXED_DT && steps < 8) {   // 8 = spiral-of-death guard
        game.step(CFG.PHYSICS.FIXED_DT);
        acc -= CFG.PHYSICS.FIXED_DT;
        steps++;
      }
      if (steps === 8) acc = 0;
    } else if (mode === "host" && host) {
      // Authoritative sim (same as solo) plus guests: intents in, diff snapshots out.
      acc += dt;
      let steps = 0;
      while (acc >= CFG.PHYSICS.FIXED_DT && steps < 8) {
        game.step(CFG.PHYSICS.FIXED_DT);
        acc -= CFG.PHYSICS.FIXED_DT;
        steps++;
      }
      if (steps === 8) acc = 0;
      host.broadcast();
    } else if (net && net.connected) {
      net.update();                                    // interpolate server state into the mirror
      for (const p of game.particles) p.step(dt);      // cosmetic particles only, no sim physics
      game.particles = game.particles.filter(p => !p.dead);
      for (let i = game.feed.length - 1; i >= 0; i--) {
        game.feed[i].t -= dt;
        if (game.feed[i].t <= 0) game.feed.splice(i, 1);
      }
    }

    // --- DRAIN SIM EVENTS into audio / camera / UI ---
    const listener = game.state === "dead" ? game.deathCam : game.local;
    for (const ev of game.events) {
      if (ev.type === "absorb") {
        const d = listener ? Math.hypot(ev.x - listener.x, ev.y - listener.y) : null;
        audio.absorb(ev.r, d, camera.viewRadius, ev.victim && ev.victim.type === "player");
        if (ev.hole === game.local) camera.kick(clamp(ev.r / 90, 0.04, 0.9));
        if (net) game.spawnAbsorption({ x: ev.x, y: ev.y, r: ev.r, tint: ev.victim.tint }, ev.hole || { vx: 0, vy: 0 });
      } else if (ev.type === "death") {
        audio.death();
        camera.kick(1.4);
        camera.hard = false;
        deathDelay = 1.15;                 // let the kill land before the UI covers it
      } else if (ev.type === "spawn") {
        audio.spawn();
        camera.hard = true;
        deathEl.classList.add("gone");
      }
    }
    game.events.length = 0;

    if (deathDelay > 0) {
      deathDelay -= dt;
      if (deathDelay <= 0 && game.state === "dead") showDeath();
    }

    // --- CAMERA ---
    let camTarget;
    if (game.state === "playing") camTarget = game.local;
    else if (game.state === "dead") {
      if (game.deathCam && game.deathCam.dead) game.deathCam = null;   // our killer got eaten too
      camTarget = game.deathCam || attractTarget();
    }
    else camTarget = attractTarget();
    camera.follow(camTarget, dt);

    // --- MULTIPLAYER: read mouse intent after the camera is positioned, ship it upstream ---
    if (mode === "multi" && net && net.connected && game.state === "playing" && game.local) {
      localController.update(game.local);
      net.sendIntent(game.local.intentX, game.local.intentY);
    }

    renderer.draw(game);
    hud.update(game, fps, dt);
  }

  requestAnimationFrame(frame);
  window.BLACKHOLE = { game, camera, renderer, audio, CFG, get net() { return net; }, get host() { return host; } };
})();
</script>
</body>
