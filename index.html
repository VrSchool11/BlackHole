<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
<title>Blackhole.io</title>
<style>
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    background: #000; overflow: hidden;
    cursor: crosshair;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    -webkit-font-smoothing: antialiased;
  }
  #game { display: block; position: fixed; inset: 0; width: 100vw; height: 100vh; background: #000; }

  /* ---------------- HUD ---------------- */
  #hud {
    position: fixed; top: 14px; left: 16px; z-index: 10;
    font-size: 12px; line-height: 1.55; letter-spacing: 0.06em;
    color: #9fd4ff; text-shadow: 0 0 8px rgba(80,170,255,0.55);
    pointer-events: none; user-select: none;
  }
  #hud .k { color: #4d7fa8; }
  #hud .big { font-size: 17px; color: #dff1ff; letter-spacing: 0.12em; }

  #board {
    position: fixed; top: 14px; right: 16px; text-align: right; z-index: 10;
    font-size: 12px; line-height: 1.6;
    color: #7fb6e0; text-shadow: 0 0 8px rgba(80,170,255,0.4);
    pointer-events: none; user-select: none;
  }
  #board .hdr { color: #46708f; letter-spacing: 0.2em; margin-bottom: 4px; }
  #board .me { color: #ffd9a0; text-shadow: 0 0 10px rgba(255,180,90,0.6); }

  /* ---------------- Kill feed ---------------- */
  #feed {
    position: fixed; top: 148px; right: 16px; text-align: right; z-index: 10;
    font-size: 11.5px; line-height: 1.85; pointer-events: none; user-select: none;
    color: #6f93b0;
  }
  #feed div { animation: feedIn 0.35s ease both; }
  #feed .ate { color: #cfe4ff; }
  #feed .mine { color: #ffd9a0; text-shadow: 0 0 10px rgba(255,180,90,0.5); }
  #feed .victim { color: #ff8f8f; }
  @keyframes feedIn { from { opacity: 0; transform: translateX(14px); } to { opacity: 1; transform: none; } }

  /* ---------------- Overlays ---------------- */
  .overlay {
    position: fixed; inset: 0; z-index: 20;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 18px; text-align: center; user-select: none;
    background: radial-gradient(ellipse at center, rgba(0,0,0,0.62) 0%, rgba(0,0,0,0.90) 72%);
    backdrop-filter: blur(2.5px);
    -webkit-backdrop-filter: blur(2.5px);
    transition: opacity 0.45s ease;
  }
  /* The death cam parks on your killer, so anything can be behind this text.
     Every overlay line carries its own shadow so it stays legible over a white halo. */
  .overlay > * { text-shadow: 0 2px 18px rgba(0,0,0,0.95), 0 0 40px rgba(0,0,0,0.8); }
  .overlay.gone { opacity: 0; pointer-events: none; }

  h1 {
    margin: 0; font-size: clamp(30px, 7vw, 62px); letter-spacing: 0.4em; font-weight: 200;
    color: #fff; text-shadow: 0 0 30px rgba(120,190,255,0.85), 0 0 90px rgba(90,140,255,0.45);
    padding-left: 0.4em;
  }
  .sub { color: #85b3d0; letter-spacing: 0.18em; font-size: 12.5px; line-height: 2; }
  .stats { text-shadow: none; }
  .rule { width: 190px; height: 1px; background: linear-gradient(90deg, transparent, #3f6f96, transparent); }

  input[type=text] {
    background: rgba(10,20,34,0.8); border: 1px solid #2c5170; color: #dff1ff;
    font-family: inherit; font-size: 15px; letter-spacing: 0.16em; text-align: center;
    padding: 12px 18px; width: 230px; border-radius: 3px; outline: none;
    text-transform: uppercase;
  }
  input[type=text]:focus { border-color: #5aa0d8; box-shadow: 0 0 22px rgba(90,160,216,0.4); }

  button {
    background: rgba(255,180,94,0.09); border: 1px solid #ffb45e; color: #ffd9a0;
    font-family: inherit; font-size: 13px; letter-spacing: 0.28em; font-weight: 500;
    padding: 13px 34px 13px 38px; border-radius: 3px; cursor: pointer;
    transition: background 0.18s ease, box-shadow 0.18s ease, transform 0.12s ease;
    text-shadow: 0 0 12px rgba(255,180,94,0.6);
  }
  button:hover { background: rgba(255,180,94,0.2); box-shadow: 0 0 34px rgba(255,180,94,0.35); }
  button:active { transform: scale(0.97); }

  /* ---------------- Death screen ---------------- */
  #death h1 { color: #ff9a9a; text-shadow: 0 0 30px rgba(255,90,90,0.8), 0 0 90px rgba(255,40,40,0.35); }
  #death .killer { font-size: 15px; letter-spacing: 0.2em; color: #9fb8cf; }
  #death .killer b { color: #fff; font-weight: 500; text-shadow: 0 0 16px rgba(255,255,255,0.5); }
  .stats { display: flex; gap: 34px; margin: 4px 0 2px; }
  .stat { min-width: 84px; }
  .stat .v { font-size: 23px; color: #dff1ff; letter-spacing: 0.05em;
             text-shadow: 0 0 20px rgba(0,0,0,0.95), 0 0 8px rgba(0,0,0,1); }
  .stat .l { font-size: 10px; color: #7ba8c8; letter-spacing: 0.2em; margin-top: 5px;
             text-shadow: 0 0 14px rgba(0,0,0,1), 0 1px 3px rgba(0,0,0,1); }
  .hint { font-size: 10.5px; color: #3f6280; letter-spacing: 0.2em; }

  /* ---------------- Sound toggle ---------------- */
  #sound {
    position: fixed; bottom: 16px; left: 16px; z-index: 12;
    font-size: 11px; letter-spacing: 0.18em; color: #4d7fa8;
    border: 1px solid #24425c; padding: 7px 12px; border-radius: 3px;
    cursor: pointer; user-select: none; background: rgba(4,10,18,0.6);
    transition: color 0.16s, border-color 0.16s;
  }
  #sound:hover { color: #9fd4ff; border-color: #3f6f96; }
  #sound.off { color: #5a3f3f; border-color: #4a2a2a; }
</style>
</head>
<body>
<canvas id="game"></canvas>

<div id="hud">
  <div class="big">MASS <span id="ui-mass">0</span></div>
  <div><span class="k">X</span> <span id="ui-x">0</span> &nbsp; <span class="k">Y</span> <span id="ui-y">0</span></div>
  <div><span class="k">FPS</span> <span id="ui-fps">0</span> &nbsp; <span class="k">ENT</span> <span id="ui-ent">0</span></div>
  <div><span class="k">TIME</span> <span id="ui-time">0:00</span> &nbsp; <span class="k">EATEN</span> <span id="ui-eaten">0</span></div>
</div>

<div id="board">
  <div class="hdr">SINGULARITIES</div>
  <div id="ui-board"></div>
</div>
<div id="feed"></div>

<div id="sound">SOUND ON</div>

<!-- ---------------- START ---------------- -->
<div class="overlay" id="menu">
  <h1>BLACKHOLE</h1>
  <div class="rule"></div>
  <div class="sub">SWALLOW DUST. THEN ASTEROIDS. THEN PLANETS.<br>THEN EVERYONE ELSE.</div>
  <input type="text" id="name" maxlength="12" placeholder="YOUR NAME" autocomplete="off" spellcheck="false" />
  <button id="play">COLLAPSE</button>
  <div class="hint">MOVE WITH THE MOUSE</div>
</div>

<!-- ---------------- DEATH ---------------- -->
<div class="overlay gone" id="death">
  <h1>DEVOURED</h1>
  <div class="killer">BY <b id="d-killer">—</b></div>
  <div class="rule"></div>
  <div class="stats">
    <div class="stat"><div class="v" id="d-mass">0</div><div class="l">PEAK MASS</div></div>
    <div class="stat"><div class="v" id="d-rank">—</div><div class="l">BEST RANK</div></div>
    <div class="stat"><div class="v" id="d-time">0:00</div><div class="l">SURVIVED</div></div>
    <div class="stat"><div class="v" id="d-eaten">0</div><div class="l">ABSORBED</div></div>
  </div>
  <button id="respawn">COLLAPSE AGAIN</button>
  <div class="hint">OR PRESS SPACE</div>
</div>

<script>
"use strict";
/* ==========================================================================================
   BLACKHOLE.IO
   ------------------------------------------------------------------------------------------
   ARCHITECTURE (this is the seam multiplayer plugs into):

     Game        -> authoritative SIMULATION. Owns world, entities, step(dt). Never draws.
                    Transplantable to a server as-is.
     Renderer    -> READS Game, writes pixels. Never mutates simulation state.
     Controller  -> anything producing an "intent" (a desired world point) for a Player.
                    LocalMouseController (human) and HumanlikeController (bots) are
                    interchangeable; a NetworkController drops in with no other changes.
     Audio       -> fully synthesised WebAudio (no asset files). Event-driven off the sim.

   Loop is a fixed-timestep accumulator so physics is identical at 60Hz and 240Hz.
   ========================================================================================== */


/* ==========================================================================================
   0. CONFIG
   ========================================================================================== */
const CFG = {
  WORLD: { w: 5000, h: 5000 },
  COUNTS: { dust: 520, asteroids: 54, planets: 9, bots: 9 },

  PHYSICS: {
    FIXED_DT: 1 / 120,
    MAX_FRAME_DT: 0.10,
    G: 26.0,                    // gravity constant, tuned by feel
    INFLUENCE_MUL: 15,
    INFLUENCE_BASE: 140,
    SWIRL: 0.62,                // tangential term -> spiral in-fall instead of straight dive
    MAX_ACCEL: 5200,
    DRAG: 0.55,
    EAT_RATIO: 1.06,            // must be this much heavier to consume a rival
    EAT_OVERLAP: 0.72
  },

  PLAYER: {
    START_MASS: Math.PI * 9 * 9,
    BASE_SPEED: 430,
    SPEED_FALLOFF: 0.42,
    MIN_SPEED: 74,
    ACCEL_LERP: 3.1,
    SPAWN_SHIELD: 3.0           // seconds of spawn protection
  },

  CAMERA: { VIEW_REF: 620, VIEW_PAD: 46, MIN_ZOOM: 0.16, MAX_ZOOM: 1.5, LERP: 2.4 },

  RENDER: {
    TRAIL_FADE: 0.30,
    STAR_LAYERS: [
      { count: 420, speed: 0.14, size: 0.9,  alpha: 0.42 },
      { count: 260, speed: 0.34, size: 1.35, alpha: 0.62 },
      { count: 140, speed: 0.62, size: 2.0,  alpha: 0.92 }
    ],
    SPAGHETTI_MAX: 4.6
  }
};


/* ==========================================================================================
   1. MATH / UTIL
   ========================================================================================== */
const TAU = Math.PI * 2;
const clamp = (v, a, b) => v < a ? a : (v > b ? b : v);
const lerp  = (a, b, t) => a + (b - a) * t;
/** Frame-rate independent lerp: x += (target-x)*(1-e^(-k*dt)). Same result at any refresh. */
const damp  = (a, b, k, dt) => lerp(a, b, 1 - Math.exp(-k * dt));
const rand  = (a, b) => a + Math.random() * (b - a);
const randi = (a, b) => Math.floor(rand(a, b + 1));
const pick  = arr => arr[(Math.random() * arr.length) | 0];
const chance = p => Math.random() < p;

/** AREA-based growth: r = sqrt(A/PI). Doubling mass only scales radius by 1.41. */
const radiusFromMass = m => Math.sqrt(m / Math.PI);
const massFromRadius = r => Math.PI * r * r;

const fmt = n => n >= 1e6 ? (n / 1e6).toFixed(2) + "M"
              : n >= 1e3 ? (n / 1e3).toFixed(1) + "k"
              : Math.round(n).toString();
const mmss = s => Math.floor(s / 60) + ":" + String(Math.floor(s % 60)).padStart(2, "0");

let __id = 1;
const nextId = () => __id++;


/* ==========================================================================================
   2. AUDIO — everything synthesised at runtime. No files, no network, no libraries.
   ========================================================================================== */
class GameAudio {
  constructor() {
    this.ctx = null;
    this.enabled = true;
    this.ready = false;
    this.lastAbsorb = 0;     // rate-limit so a 40-dust gulp doesn't machine-gun
  }

  /** Must be called from inside a user gesture (browser autoplay policy). */
  unlock() {
    if (this.ready) return;
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    this.ctx = new AC();
    const c = this.ctx;

    this.master = c.createGain();
    this.master.gain.value = 0.9;
    this.master.connect(c.destination);

    // A gentle bus compressor keeps a 30-particle absorb from clipping.
    this.bus = c.createDynamicsCompressor();
    this.bus.threshold.value = -18;
    this.bus.ratio.value = 5;
    this.bus.attack.value = 0.004;
    this.bus.release.value = 0.22;
    this.bus.connect(this.master);

    // Shared noise buffer — generating white noise once and reusing it is far cheaper
    // than allocating a new buffer per sound effect.
    const len = c.sampleRate * 2;
    this.noise = c.createBuffer(1, len, c.sampleRate);
    const d = this.noise.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;

    this.startAmbience();
    this.ready = true;
  }

  get t() { return this.ctx.currentTime; }
  get on() { return this.ready && this.enabled && this.ctx.state === "running"; }

  setEnabled(v) {
    this.enabled = v;
    if (this.ready) this.master.gain.setTargetAtTime(v ? 0.9 : 0, this.t, 0.05);
  }

  /** Two detuned drones + filtered noise wash = the sound of deep space. Very quiet. */
  startAmbience() {
    const c = this.ctx, t = this.t;
    const g = c.createGain(); g.gain.value = 0.0; g.connect(this.bus);
    g.gain.setTargetAtTime(0.06, t, 3);

    [55, 82.5].forEach((f, i) => {
      const o = c.createOscillator();
      o.type = "sine"; o.frequency.value = f * (i ? 1.003 : 1);
      const og = c.createGain(); og.gain.value = i ? 0.35 : 0.5;
      // Slow LFO on gain so the drone breathes instead of sitting still.
      const lfo = c.createOscillator(); lfo.frequency.value = 0.05 + i * 0.03;
      const lg = c.createGain(); lg.gain.value = 0.22;
      lfo.connect(lg); lg.connect(og.gain); lfo.start();
      o.connect(og); og.connect(g); o.start();
    });

    const n = c.createBufferSource();
    n.buffer = this.noise; n.loop = true;
    const nf = c.createBiquadFilter(); nf.type = "lowpass"; nf.frequency.value = 220; nf.Q.value = 0.6;
    const ng = c.createGain(); ng.gain.value = 0.05;
    n.connect(nf); nf.connect(ng); ng.connect(g); n.start();

    this.ambientGain = g;
  }

  /** Distance attenuation from the listener (the local player / death cam). */
  atten(dist, viewRadius) {
    if (dist == null) return 1;
    return clamp(1 - dist / (viewRadius * 1.9), 0, 1);
  }

  /**
   * THE WHOOMP. A downward pitch sweep (the "swallow") layered with a filtered noise
   * thump (the "impact"). Bigger victims -> lower, longer, louder. This mapping is the
   * whole trick: eating dust ticks, eating a planet detonates.
   */
  absorb(victimRadius, dist, viewRadius, isPlayerKill) {
    if (!this.on) return;
    const now = this.t;
    // Rate limit tiny gulps: at most one every 28ms, else a dust field is a buzzsaw.
    if (victimRadius < 8 && now - this.lastAbsorb < 0.028) return;
    this.lastAbsorb = now;

    const c = this.ctx;
    const size = clamp(victimRadius / 60, 0.02, 1.6);        // 0 = speck, 1.6 = big planet
    const vol = this.atten(dist, viewRadius) * (0.16 + size * 0.55) * (isPlayerKill ? 1.5 : 1);
    if (vol < 0.006) return;

    const dur = 0.10 + size * 0.55;
    // Low mass -> high pitch. Inverse map so growth *sounds* like growth.
    const f0 = 480 / (0.35 + size * 1.7);
    const f1 = f0 * 0.28;

    // --- swallow sweep ---
    const o = c.createOscillator();
    o.type = size > 0.5 ? "sine" : "triangle";
    o.frequency.setValueAtTime(f0, now);
    o.frequency.exponentialRampToValueAtTime(Math.max(24, f1), now + dur);
    const og = c.createGain();
    og.gain.setValueAtTime(0.0001, now);
    og.gain.exponentialRampToValueAtTime(vol, now + 0.012);
    og.gain.exponentialRampToValueAtTime(0.0001, now + dur);
    o.connect(og); og.connect(this.bus);
    o.start(now); o.stop(now + dur + 0.05);

    // --- impact thump: noise through a closing lowpass ---
    const n = c.createBufferSource();
    n.buffer = this.noise;
    n.playbackRate.value = rand(0.8, 1.25);
    const nf = c.createBiquadFilter();
    nf.type = "lowpass";
    nf.frequency.setValueAtTime(1400 + 2600 * (1 - size), now);
    nf.frequency.exponentialRampToValueAtTime(120, now + dur * 0.9);
    nf.Q.value = 1.4;
    const ng = c.createGain();
    ng.gain.setValueAtTime(vol * 0.75, now);
    ng.gain.exponentialRampToValueAtTime(0.0001, now + dur * 0.95);
    n.connect(nf); nf.connect(ng); ng.connect(this.bus);
    n.start(now); n.stop(now + dur + 0.05);

    // --- sub-bass body, only for genuinely big meals ---
    if (size > 0.35) {
      const s = c.createOscillator();
      s.type = "sine";
      s.frequency.setValueAtTime(90 * (1 - size * 0.4), now);
      s.frequency.exponentialRampToValueAtTime(28, now + dur * 1.3);
      const sg = c.createGain();
      sg.gain.setValueAtTime(0.0001, now);
      sg.gain.exponentialRampToValueAtTime(vol * 0.9, now + 0.02);
      sg.gain.exponentialRampToValueAtTime(0.0001, now + dur * 1.4);
      s.connect(sg); sg.connect(this.bus);
      s.start(now); s.stop(now + dur * 1.5);
    }
  }

  /** Rising tension sting for the moment a bigger hole locks onto you. */
  danger() {
    if (!this.on) return;
    const c = this.ctx, now = this.t;
    const o = c.createOscillator();
    o.type = "sawtooth";
    o.frequency.setValueAtTime(70, now);
    o.frequency.exponentialRampToValueAtTime(190, now + 0.5);
    const f = c.createBiquadFilter(); f.type = "lowpass"; f.frequency.value = 500;
    const g = c.createGain();
    g.gain.setValueAtTime(0.0001, now);
    g.gain.exponentialRampToValueAtTime(0.11, now + 0.25);
    g.gain.exponentialRampToValueAtTime(0.0001, now + 0.6);
    o.connect(f); f.connect(g); g.connect(this.bus);
    o.start(now); o.stop(now + 0.65);
  }

  /** Death: everything drops an octave and collapses. Ambience ducks out and returns. */
  death() {
    if (!this.on) return;
    const c = this.ctx, now = this.t;

    if (this.ambientGain) {
      this.ambientGain.gain.setTargetAtTime(0.005, now, 0.3);
      this.ambientGain.gain.setTargetAtTime(0.06, now + 3.5, 1.5);
    }

    [220, 164.8, 110].forEach((f, i) => {
      const o = c.createOscillator();
      o.type = "sine";
      o.frequency.setValueAtTime(f, now + i * 0.09);
      o.frequency.exponentialRampToValueAtTime(f * 0.25, now + 2.2);
      const g = c.createGain();
      g.gain.setValueAtTime(0.0001, now + i * 0.09);
      g.gain.exponentialRampToValueAtTime(0.16, now + i * 0.09 + 0.05);
      g.gain.exponentialRampToValueAtTime(0.0001, now + 2.4);
      o.connect(g); g.connect(this.bus);
      o.start(now + i * 0.09); o.stop(now + 2.5);
    });

    const n = c.createBufferSource();
    n.buffer = this.noise;
    const nf = c.createBiquadFilter();
    nf.type = "lowpass";
    nf.frequency.setValueAtTime(3000, now);
    nf.frequency.exponentialRampToValueAtTime(60, now + 1.8);
    const ng = c.createGain();
    ng.gain.setValueAtTime(0.24, now);
    ng.gain.exponentialRampToValueAtTime(0.0001, now + 2.0);
    n.connect(nf); nf.connect(ng); ng.connect(this.bus);
    n.start(now); n.stop(now + 2.1);
  }

  /** Spawn: a short upward bloom. */
  spawn() {
    if (!this.on) return;
    const c = this.ctx, now = this.t;
    const o = c.createOscillator();
    o.type = "sine";
    o.frequency.setValueAtTime(90, now);
    o.frequency.exponentialRampToValueAtTime(420, now + 0.35);
    const g = c.createGain();
    g.gain.setValueAtTime(0.0001, now);
    g.gain.exponentialRampToValueAtTime(0.13, now + 0.06);
    g.gain.exponentialRampToValueAtTime(0.0001, now + 0.5);
    o.connect(g); g.connect(this.bus);
    o.start(now); o.stop(now + 0.55);
  }

  ui() {
    if (!this.on) return;
    const c = this.ctx, now = this.t;
    const o = c.createOscillator(); o.type = "square"; o.frequency.value = 660;
    const g = c.createGain();
    g.gain.setValueAtTime(0.0001, now);
    g.gain.exponentialRampToValueAtTime(0.04, now + 0.006);
    g.gain.exponentialRampToValueAtTime(0.0001, now + 0.09);
    o.connect(g); g.connect(this.bus);
    o.start(now); o.stop(now + 0.1);
  }
}


/* ==========================================================================================
   3. ENTITIES — pure simulation, zero canvas calls.
   ========================================================================================== */
class Entity {
  constructor(x, y, mass) {
    this.id = nextId();
    this.x = x; this.y = y;
    this.vx = 0; this.vy = 0;
    this.mass = mass;
    this.r = radiusFromMass(mass);
    this.dead = false;
    this.stretch = 1;        // spaghettification factor (1 = untouched sphere)
    this.stretchAng = 0;     // world angle of the stretch long-axis
    this.spin = rand(-1.6, 1.6);
    this.angle = rand(0, TAU);
    this.tint = "#8fa6c8";
    this.type = "entity";
  }

  setMass(m) { this.mass = m; this.r = radiusFromMass(m); }

  integrate(dt, world) {
    this.x += this.vx * dt;
    this.y += this.vy * dt;
    this.angle += this.spin * dt;
    const pad = this.r;
    if (this.x < pad)           { this.x = pad;           this.vx =  Math.abs(this.vx) * 0.5; }
    if (this.x > world.w - pad) { this.x = world.w - pad; this.vx = -Math.abs(this.vx) * 0.5; }
    if (this.y < pad)           { this.y = pad;           this.vy =  Math.abs(this.vy) * 0.5; }
    if (this.y > world.h - pad) { this.y = world.h - pad; this.vy = -Math.abs(this.vy) * 0.5; }
  }
}

class Dust extends Entity {
  constructor(x, y) {
    super(x, y, massFromRadius(rand(1.6, 3.4)));
    this.vx = rand(-14, 14); this.vy = rand(-14, 14);
    this.type = "dust";
    this.tint = pick(["#9fd8ff", "#c9b6ff", "#ffe6a8", "#a9ffe4", "#ffb9d8"]);
    this.twinkle = rand(0, TAU);
  }
}

class Asteroid extends Entity {
  constructor(x, y) {
    const r = rand(7, 21);
    super(x, y, massFromRadius(r));
    this.vx = rand(-30, 30); this.vy = rand(-30, 30);
    this.type = "asteroid";
    this.tint = pick(["#8b8375", "#6f7c8c", "#94836e", "#77706b"]);
    this.lumps = [];                       // pre-baked lumpy silhouette
    const n = randi(7, 11);
    for (let i = 0; i < n; i++) this.lumps.push(rand(0.74, 1.2));
  }
}

class Planet extends Entity {
  constructor(x, y) {
    const r = rand(46, 132);
    super(x, y, massFromRadius(r));
    this.vx = rand(-8, 8); this.vy = rand(-8, 8);
    this.spin = rand(-0.22, 0.22);
    this.type = "planet";
    this.pal = pick([
      ["#3f6fa8", "#7fb2d8", "#254a72"], ["#a8703f", "#d8a97f", "#6f4425"],
      ["#4b8f6a", "#8fd8b0", "#2c5a41"], ["#8a4b8f", "#c98fd8", "#4f2c5a"],
      ["#a83f4f", "#d87f8f", "#722530"]
    ]);
    this.tint = this.pal[0];
    this.hasRing = chance(0.34);
    this.ringTilt = rand(-0.6, 0.6);
  }
}

/** Player — local human, bot and (later) remote peer all use this class unchanged. */
class Player extends Entity {
  constructor(x, y, name, color) {
    super(x, y, CFG.PLAYER.START_MASS);
    this.type = "player";
    this.name = name;
    this.color = color;
    this.intentX = x; this.intentY = y;    // desired world point — the ONLY control input
    this.isLocal = false;
    this.isBot = false;
    this.controller = null;
    this.pulse = rand(0, TAU);
    this.diskAngle = rand(0, TAU);
    this.eatFlash = 0;
    this.shield = 0;                       // spawn protection, seconds
    this.trail = [];
    // run stats
    this.absorbed = 0;
    this.peakMass = this.mass;
    this.bestRank = 99;
    this.spawnTime = 0;
  }

  get maxSpeed() {
    const s = CFG.PLAYER.BASE_SPEED * Math.pow(20 / (20 + this.r), CFG.PLAYER.SPEED_FALLOFF);
    return Math.max(CFG.PLAYER.MIN_SPEED, s);
  }
  get influence() { return this.r * CFG.PHYSICS.INFLUENCE_MUL + CFG.PHYSICS.INFLUENCE_BASE; }

  step(dt, world) {
    // 1. Vector to the intent point.
    const dx = this.intentX - this.x, dy = this.intentY - this.y;
    const dist = Math.hypot(dx, dy) || 1;
    // 2. Ease off inside a deadzone our own size so we settle instead of jittering.
    const ease = clamp(dist / (this.r * 1.6 + 26), 0, 1);
    const desiredVX = (dx / dist) * this.maxSpeed * ease;
    const desiredVY = (dy / dist) * this.maxSpeed * ease;
    // 3. Lerp VELOCITY (not position) => momentum. Heavier holes accelerate slower.
    const k = CFG.PLAYER.ACCEL_LERP * (24 / (24 + this.r * 0.30));
    this.vx = damp(this.vx, desiredVX, k, dt);
    this.vy = damp(this.vy, desiredVY, k, dt);

    this.integrate(dt, world);

    this.pulse += dt * 2.1;
    this.diskAngle += dt * (0.55 + 26 / (this.r + 26));
    this.eatFlash = Math.max(0, this.eatFlash - dt * 2.6);
    if (this.shield > 0) this.shield = Math.max(0, this.shield - dt);
    if (this.mass > this.peakMass) this.peakMass = this.mass;

    this.trail.push(this.x, this.y);
    while (this.trail.length > 52) this.trail.splice(0, 2);
  }

  consume(other) {
    this.setMass(this.mass + other.mass);   // masses add, radius re-derived from area
    this.absorbed++;
    this.eatFlash = 1;
    if (other.type === "player") this.shield = 0;   // killing a rival drops your shield
  }

  reset(x, y) {
    this.dead = false;
    this.setMass(CFG.PLAYER.START_MASS);
    this.x = this.intentX = x;
    this.y = this.intentY = y;
    this.vx = this.vy = 0;
    this.trail.length = 0;
    this.absorbed = 0;
    this.peakMass = this.mass;
    this.bestRank = 99;
    this.shield = CFG.PLAYER.SPAWN_SHIELD;
    this.eatFlash = 0;
  }
}

class Particle {
  constructor(x, y, vx, vy, life, size, color) {
    this.x = x; this.y = y; this.vx = vx; this.vy = vy;
    this.life = life; this.maxLife = life;
    this.size = size; this.color = color; this.dead = false;
  }
  step(dt) {
    this.x += this.vx * dt; this.y += this.vy * dt;
    this.vx *= 1 - 2.0 * dt; this.vy *= 1 - 2.0 * dt;
    this.life -= dt;
    if (this.life <= 0) this.dead = true;
  }
}

/* ------------------------------------------------------------------------------------------
   HumanlikeController
   ------------------------------------------------------------------------------------------
   A bot that plays like a PERSON, not a solver. Five deliberate handicaps, each one
   modelling a real limit of a human at a mouse:

     1. LIMITED VISION   — it can only consider things inside a viewport-sized perception
                           radius. No omniscience: it cannot see, and will happily blunder
                           toward, a monster sitting just off its screen.
     2. SACCADES         — it re-reads the world ~8x/second, not 120x. Between glances it
                           acts on a stale picture, so fast targets get missed.
     3. REACTION LATENCY — noticing a threat starts a 150–450ms timer before the body
                           responds. Slow bots genuinely get caught out.
     4. A HAND, NOT A TELEPORT — it never writes the target position into intent. It drives
                           a virtual CURSOR with finite speed, tremor and overshoot; intent
                           is wherever the cursor currently is. All the lag, wobble and
                           corner-cutting of real mouse movement falls out of this for free.
     5. FALLIBLE JUDGEMENT — mass comparisons are made through a noise filter scaled by
                           (1 - skill), so weak bots misjudge fights, commit, and panic.

   Plus personality: aggression, greed, caution, patience and skill are rolled per bot, so
   one plays like a nervous farmer and another dives at everything. And they get bored,
   hesitate, and chase food clusters rather than single optimal pellets.
------------------------------------------------------------------------------------------ */
class HumanlikeController {
  constructor(game) {
    this.game = game;

    // --- personality roll ---
    const skill = rand(0.18, 0.95);
    this.p = {
      skill,
      reaction:   rand(0.13, 0.22) + (1 - skill) * 0.28,  // 130ms ace .. 450ms button-masher
      aggression: rand(0.15, 0.95),
      greed:      rand(0.2, 1.0),
      caution:    rand(0.2, 1.0),
      patience:   rand(0.5, 2.4),                          // seconds before re-deciding
      tremor:     (1 - skill) * 30 + 5,                    // px of hand wobble
      handSpeed:  700 + skill * 1700                       // cursor px/s
    };

    this.seed = rand(0, 100);
    this.state = "wander";
    this.cx = 0; this.cy = 0;          // virtual cursor (world space)
    this.cursorInit = false;
    this.goalX = 0; this.goalY = 0;
    this.target = null;
    this.threat = null;
    this.noticeTimer = 0;              // counts down the reaction latency
    this.decisionTimer = 0;
    this.glanceTimer = 0;
    this.hesitate = 0;
    this.jt = rand(0, 50);
    this.view = { prey: [], threats: [] };
  }

  /** Viewport-sized awareness — mirrors what a human could actually see on screen. */
  perception(player) { return player.r * 14 + 850; }

  update(player, dt) {
    if (!this.cursorInit) { this.cx = player.x; this.cy = player.y; this.cursorInit = true; }

    this.jt += dt;
    this.glanceTimer -= dt;
    this.decisionTimer -= dt;
    this.noticeTimer -= dt;
    this.hesitate -= dt;

    // --- 1. SACCADE: re-read the world only ~8x/sec ---
    if (this.glanceTimer <= 0) {
      this.glanceTimer = rand(0.09, 0.17);
      this.look(player);
    }

    // --- 2. THREAT RESPONSE, gated by reaction latency ---
    const t = this.view.threats[0] || null;
    if (t && t !== this.threat) {
      this.threat = t;
      this.noticeTimer = this.p.reaction;      // the "wait, what" beat before fleeing
    } else if (!t) {
      this.threat = null;
    }

    if (this.threat && this.noticeTimer <= 0) {
      this.state = "flee";
    } else if (this.state === "flee" && !this.threat) {
      this.state = "wander";
      this.decisionTimer = 0;
    }

    // --- 3. DECIDE ---
    if (this.state !== "flee" && this.decisionTimer <= 0) this.decide(player);

    // --- 4. PICK A GOAL FOR THE HAND ---
    let urgency = 0.5;
    if (this.state === "flee" && this.threat) {
      urgency = 1;
      // Humans don't flee on a perfect radial. They angle off, and panic-wobble.
      const dx = player.x - this.threat.x, dy = player.y - this.threat.y;
      const d = Math.hypot(dx, dy) || 1;
      const panic = Math.sin(this.jt * 4.2 + this.seed) * (1 - this.p.skill) * 0.5;
      const a = Math.atan2(dy, dx) + panic;
      this.goalX = player.x + Math.cos(a) * 1100;
      this.goalY = player.y + Math.sin(a) * 1100;
    } else if (this.state === "hunt" && this.target && !this.target.dead) {
      urgency = 0.55 + this.p.aggression * 0.45;
      // Lead the target slightly — good players lead more, bad players chase the ghost.
      const lead = this.p.skill * 0.35;
      this.goalX = this.target.x + this.target.vx * lead;
      this.goalY = this.target.y + this.target.vy * lead;
    } else {
      urgency = 0.35;
    }

    // Occasional hesitation — the human "wait, hang on" pause.
    if (this.hesitate > 0) { this.goalX = player.x; this.goalY = player.y; urgency = 0.2; }

    this.moveHand(player, dt, urgency);
  }

  /** One glance at the world: gather visible prey and visible threats, nearest-first. */
  look(player) {
    const g = this.game;
    const R = this.perception(player);
    const R2 = R * R;
    const prey = [], threats = [];
    // Judgement noise: weak bots literally cannot tell a close fight apart.
    const noise = () => 1 + rand(-0.3, 0.3) * (1 - this.p.skill);

    for (const p of g.players) {
      if (p === player || p.dead) continue;
      const dx = p.x - player.x, dy = p.y - player.y;
      const d2 = dx * dx + dy * dy;
      if (d2 > R2) continue;                                  // outside their "screen"
      const est = p.mass * noise();
      if (est > player.mass * CFG.PHYSICS.EAT_RATIO) threats.push({ e: p, d2 });
      else if (player.mass > est * CFG.PHYSICS.EAT_RATIO && p.shield <= 0) prey.push({ e: p, d2, w: 2.4 });
    }
    for (const e of g.food) {
      const dx = e.x - player.x, dy = e.y - player.y;
      const d2 = dx * dx + dy * dy;
      if (d2 > R2) continue;
      if (e.mass * noise() > player.mass / CFG.PHYSICS.EAT_RATIO) continue;
      prey.push({ e, d2, w: 1 });
    }

    threats.sort((a, b) => a.d2 - b.d2);
    this.view.threats = threats.map(x => x.e);
    this.view.prey = prey;
  }

  /** Commit to something for a while. Humans don't re-solve every frame. */
  decide(player) {
    this.decisionTimer = this.p.patience * rand(0.7, 1.4);

    // Sometimes just... pause.
    if (chance(0.07 * (1 - this.p.skill) + 0.02)) {
      this.hesitate = rand(0.2, 0.75);
    }

    let best = null, bestScore = -Infinity;
    for (const c of this.view.prey) {
      const e = c.e;
      if (e.dead) continue;
      const d = Math.sqrt(c.d2);
      // value = payoff / effort, weighted by personality, with a rival-hunting bonus
      let score = (e.mass * c.w * (c.w > 1 ? this.p.aggression * 2 : this.p.greed)) / (d + 120);
      // Big scary prey is less appealing to cautious bots even when technically edible.
      if (e.type === "planet") score *= 0.6 + (1 - this.p.caution) * 0.9;
      score *= rand(0.82, 1.18);                        // nobody picks optimally
      if (score > bestScore) { bestScore = score; best = e; }
    }

    if (best) {
      this.state = "hunt";
      this.target = best;
      return;
    }

    // Nothing visible worth eating -> head for the densest food region they know of.
    this.state = "wander";
    this.target = null;
    const cell = this.game.bestDensityCell(player.x, player.y, this.p.greed);
    if (cell && chance(0.75)) {
      this.goalX = cell.x + rand(-160, 160);
      this.goalY = cell.y + rand(-160, 160);
    } else {
      this.goalX = clamp(player.x + rand(-1500, 1500), 80, CFG.WORLD.w - 80);
      this.goalY = clamp(player.y + rand(-1500, 1500), 80, CFG.WORLD.h - 80);
    }
  }

  /**
   * The hand. The cursor chases the goal at finite speed and carries tremor, so the bot's
   * intent point always lags and wobbles exactly like a real mouse. Overshoot, corner
   * cutting and orbit-drift all emerge from this — none of it is scripted.
   */
  moveHand(player, dt, urgency) {
    const p = this.p;
    const dx = this.goalX - this.cx, dy = this.goalY - this.cy;
    const d = Math.hypot(dx, dy) || 1;
    const speed = p.handSpeed * (0.55 + urgency * 0.9);
    const step = Math.min(d, speed * dt);
    this.cx += dx / d * step;
    this.cy += dy / d * step;

    // Two-octave tremor: slow drift + fine jitter.
    const tr = p.tremor;
    const jx = Math.sin(this.jt * 2.9 + this.seed) * tr + Math.sin(this.jt * 8.1 + this.seed * 2) * tr * 0.35;
    const jy = Math.cos(this.jt * 2.3 + this.seed) * tr + Math.cos(this.jt * 7.3 + this.seed * 3) * tr * 0.35;

    player.intentX = clamp(this.cx + jx, 0, CFG.WORLD.w);
    player.intentY = clamp(this.cy + jy, 0, CFG.WORLD.h);
  }
}


/* ==========================================================================================
   5. INPUT
   ========================================================================================== */
class Input {
  constructor() {
    this.mx = window.innerWidth / 2;
    this.my = window.innerHeight / 2;
    this.moved = false;
    const set = (x, y) => { this.mx = x; this.my = y; this.moved = true; };
    window.addEventListener("mousemove", e => set(e.clientX, e.clientY), { passive: true });
    window.addEventListener("touchstart", e => { const t = e.touches[0]; if (t) set(t.clientX, t.clientY); }, { passive: true });
    window.addEventListener("touchmove",  e => { const t = e.touches[0]; if (t) set(t.clientX, t.clientY); }, { passive: true });
  }
}


/* ==========================================================================================
   6. CAMERA
   ========================================================================================== */
class Camera {
  constructor() {
    this.x = CFG.WORLD.w / 2; this.y = CFG.WORLD.h / 2;
    this.zoom = 1; this.targetZoom = 1;
    this.vw = window.innerWidth; this.vh = window.innerHeight;
    this.shake = 0; this.shx = 0; this.shy = 0;
    this.hard = true;         // hard-follow (playing) vs soft drift (death cam / attract)
  }
  resize(w, h) { this.vw = w; this.vh = h; }

  follow(target, dt) {
    if (!target) return;
    if (this.hard) { this.x = target.x; this.y = target.y; }
    else {          // cinematic lag for the death cam and attract mode
      this.x = damp(this.x, target.x, 2.2, dt);
      this.y = damp(this.y, target.y, 2.2, dt);
    }
    this.targetZoom = clamp(
      CFG.CAMERA.VIEW_REF / (target.r + CFG.CAMERA.VIEW_PAD),
      CFG.CAMERA.MIN_ZOOM, CFG.CAMERA.MAX_ZOOM
    );
    this.zoom = damp(this.zoom, this.targetZoom, CFG.CAMERA.LERP, dt);

    this.shake = Math.max(0, this.shake - dt * 2.4);
    const s = this.shake * this.shake * 13;
    this.shx = rand(-s, s); this.shy = rand(-s, s);
  }
  kick(a) { this.shake = Math.min(1.4, this.shake + a); }

  screenToWorld(sx, sy) {
    return { x: (sx - this.vw / 2) / this.zoom + this.x, y: (sy - this.vh / 2) / this.zoom + this.y };
  }
  get viewRadius() { return Math.max(this.vw, this.vh) / 2 / this.zoom; }
  viewBounds(margin = 200) {
    const hw = this.vw / 2 / this.zoom + margin, hh = this.vh / 2 / this.zoom + margin;
    return { x0: this.x - hw, y0: this.y - hh, x1: this.x + hw, y1: this.y + hh };
  }
}


/* ==========================================================================================
   7. GAME — the simulation.
   ========================================================================================== */
const HANDLES = [
  "kevin", "void_kitty", "xX_nova_Xx", "gg_ez", "mooncake", "not_a_bot", "sp4ce",
  "lurker", "TinyTim", "BIGSHRIMP", "orbital", "dave", "zzz", "404", "pixel",
  "hungrymoon", "yeet", "astro_j", "m1lk", "quasar_", "GARGANTUA", "M87*", "CYGNUS",
  "vela", "ur mom", "singularity", "noodle", "eepy", "banana", "TON618"
];
const HUES = ["#7ec8ff", "#ff7ec8", "#9cff7e", "#c89cff", "#ffe07e", "#7effe0", "#ff9c7e", "#8fa0ff", "#ffb0d0"];

class Game {
  constructor(audio) {
    this.world = { w: CFG.WORLD.w, h: CFG.WORLD.h };
    this.audio = audio;
    this.food = [];
    this.players = [];
    this.particles = [];
    this.local = null;
    this.time = 0;
    this.state = "menu";          // menu | playing | dead
    this.events = [];             // transient sim events for renderer/audio/UI
    this.feed = [];               // kill feed entries
    this.deathInfo = null;
    this.deathCam = null;

    // Coarse food-density grid. Bots use it to head for "where the food looks thick",
    // which is what people actually do, instead of solving for a single optimal pellet.
    this.gridCell = 400;
    this.gridCols = Math.ceil(this.world.w / this.gridCell);
    this.gridRows = Math.ceil(this.world.h / this.gridCell);
    this.grid = new Float32Array(this.gridCols * this.gridRows);
    this.gridTimer = 0;
  }

  init() {
    const W = this.world.w, H = this.world.h;
    for (let i = 0; i < CFG.COUNTS.dust; i++)      this.food.push(new Dust(rand(0, W), rand(0, H)));
    for (let i = 0; i < CFG.COUNTS.asteroids; i++) this.food.push(new Asteroid(rand(0, W), rand(0, H)));
    for (let i = 0; i < CFG.COUNTS.planets; i++)   this.food.push(new Planet(rand(0, W), rand(0, H)));

    const used = new Set();
    for (let i = 0; i < CFG.COUNTS.bots; i++) this.spawnBot(used);
    this.rebuildGrid();
  }

  spawnBot(used) {
    let name = pick(HANDLES), guard = 0;
    if (used) { while (used.has(name) && guard++ < 40) name = pick(HANDLES); used.add(name); }
    const spot = this.safeSpawn(null);
    const b = new Player(spot.x, spot.y, name, pick(HUES));
    b.isBot = true;
    b.setMass(CFG.PLAYER.START_MASS * rand(0.85, 2.4));
    b.shield = CFG.PLAYER.SPAWN_SHIELD;
    b.spawnTime = this.time;
    b.controller = new HumanlikeController(this);
    this.players.push(b);
    return b;
  }

  /** Create or reset the local player and drop them into the arena. */
  spawnLocal(name, controller) {
    if (!this.local) {
      this.local = new Player(0, 0, name, "#ffb45e");
      this.local.isLocal = true;
      this.local.controller = controller;
    }
    this.local.name = name || "YOU";
    const spot = this.safeSpawn(this.local);
    this.local.reset(spot.x, spot.y);
    this.local.spawnTime = this.time;
    if (!this.players.includes(this.local)) this.players.push(this.local);
    this.state = "playing";
    this.deathInfo = null;
    this.deathCam = null;
    this.events.push({ type: "spawn", hole: this.local });
  }

  killLocal(killer) {
    const me = this.local;
    this.state = "dead";
    this.deathCam = killer && !killer.dead ? killer : null;
    this.deathInfo = {
      killer: killer ? killer.name : "THE VOID",
      peakMass: me.peakMass,
      rank: me.bestRank,
      time: this.time - me.spawnTime,
      absorbed: me.absorbed
    };
    this.events.push({ type: "death", hole: me, killer });
  }

  step(dt) {
    this.time += dt;

    // Density grid refresh — 2x/sec is plenty and costs ~600 iterations.
    this.gridTimer -= dt;
    if (this.gridTimer <= 0) { this.gridTimer = 0.5; this.rebuildGrid(); }

    for (const p of this.players) { if (!p.dead && p.controller) p.controller.update(p, dt); }
    for (const p of this.players) { if (!p.dead) p.step(dt, this.world); }

    this.applyGravity(dt);

    for (const e of this.food) {
      if (e.dead) continue;
      const d = Math.exp(-CFG.PHYSICS.DRAG * dt);   // linear drag on free debris
      e.vx *= d; e.vy *= d;
      e.integrate(dt, this.world);
    }

    this.resolveEating();
    for (const p of this.particles) p.step(dt);

    this.updateRanks();
    this.compact();
    this.repopulate();

    // Age out kill-feed entries.
    for (let i = this.feed.length - 1; i >= 0; i--) {
      this.feed[i].t -= dt;
      if (this.feed[i].t <= 0) this.feed.splice(i, 1);
    }
  }

  updateRanks() {
    const sorted = this.players.slice().sort((a, b) => b.mass - a.mass);
    for (let i = 0; i < sorted.length; i++) {
      sorted[i].rank = i + 1;
      if (i + 1 < sorted[i].bestRank) sorted[i].bestRank = i + 1;
    }
    this.ranked = sorted;
  }

  rebuildGrid() {
    this.grid.fill(0);
    for (const e of this.food) {
      const cx = (e.x / this.gridCell) | 0, cy = (e.y / this.gridCell) | 0;
      if (cx < 0 || cy < 0 || cx >= this.gridCols || cy >= this.gridRows) continue;
      this.grid[cy * this.gridCols + cx] += e.mass;
    }
  }

  /** Densest food cell within reach, discounted by distance. Used by bot wandering. */
  bestDensityCell(x, y, greed) {
    let best = null, bestScore = -Infinity;
    for (let cy = 0; cy < this.gridRows; cy++) {
      for (let cx = 0; cx < this.gridCols; cx++) {
        const m = this.grid[cy * this.gridCols + cx];
        if (m <= 0) continue;
        const px = (cx + 0.5) * this.gridCell, py = (cy + 0.5) * this.gridCell;
        const d = Math.hypot(px - x, py - y);
        if (d > 2600) continue;
        const score = (m * greed) / (d + 400);
        if (score > bestScore) { bestScore = score; best = { x: px, y: py }; }
      }
    }
    return best;
  }

  /**
   * GRAVITY
   * ------------------------------------------------------------------------------------
   *   d    = H.pos - B.pos             vector from body toward the hole
   *   dist = |d|,  n̂ = d / dist        unit vector pointing at the singularity
   *
   *   Newton:  F = G·m_H·m_B / dist²
   *   We want the BODY's acceleration, a = F / m_B, so the body's own mass cancels:
   *
   *        a = G · m_H / dist²
   *
   *   ...which is both correct and exactly right for feel: a pebble and a boulder fall
   *   toward the hole at the same rate.
   *
   *   Swirl: t̂ = (-n̂.y, n̂.x) is n̂ rotated 90°. Adding a slice of acceleration along t̂
   *   gives the body angular momentum, so it CURVES in on a decaying orbit rather than
   *   falling on a straight line. Weighted by falloff (0 at the rim, 1 at the horizon).
   */
  applyGravity(dt) {
    const { G, MAX_ACCEL, SWIRL } = CFG.PHYSICS;

    for (const H of this.players) {
      if (H.dead) continue;
      const R = H.influence, R2 = R * R, Hm = H.mass;

      const pullOne = (B) => {
        if (B === H || B.dead) return;
        if (B.type === "player" && B.mass >= Hm) return;   // equals hold their ground

        const dx = H.x - B.x, dy = H.y - B.y;
        const d2 = dx * dx + dy * dy;
        if (d2 > R2 || d2 === 0) return;

        const dist = Math.sqrt(d2);
        const nx = dx / dist, ny = dy / dist;

        // Softening term keeps the denominator finite at the horizon.
        const soft = d2 + H.r * H.r * 0.55 + 40;
        let a = G * Hm / soft;
        if (a > MAX_ACCEL) a = MAX_ACCEL;

        const t = 1 - dist / R;
        const falloff = t * t;                    // 1 at centre, 0 at rim, soft outer edge

        B.vx += nx * a * dt;                      // radial pull
        B.vy += ny * a * dt;
        const swirl = a * SWIRL * falloff;        // tangential -> spiral
        B.vx += -ny * swirl * dt;
        B.vy +=  nx * swirl * dt;

        /* SPAGHETTIFICATION -----------------------------------------------------------
           Tidal stretching: the near face is pulled harder than the far face, so the body
           elongates ALONG the line to the singularity.
             stretchAng = atan2(d.y, d.x)                     long axis points at the hole
             proximity  = 1 - (dist - H.r)/(H.r*4 + 60)       ramps up in the last few radii
             stretch    = 1 + (MAX-1) * proximity²
           The renderer applies scale(stretch, 1/sqrt(stretch)) — AREA PRESERVING, so the
           body gets longer AND thinner, exactly like real tidal disruption.
        ------------------------------------------------------------------------------*/
        const proximity = clamp(1 - (dist - H.r) / (H.r * 4 + 60), 0, 1);
        const s = 1 + (CFG.RENDER.SPAGHETTI_MAX - 1) * proximity * proximity;
        if (s > B.stretch) { B.stretch = s; B.stretchAng = Math.atan2(dy, dx); }
      };

      for (const B of this.food) pullOne(B);
      for (const B of this.players) pullOne(B);
    }

    for (const B of this.food) B.stretch = damp(B.stretch, 1, 5.5, dt);
  }

  /**
   * CONSUMPTION
   * ------------------------------------------------------------------------------------
   * Two guards make this safe despite mutating `dead` while iterating the same arrays:
   *
   *   (a) Holes are processed BIGGEST FIRST on a snapshot of the array. Resolution order
   *       is therefore deterministic and mass-consistent — no ordering ambiguity between
   *       two holes that overlap each other in the same tick.
   *   (b) `if (H.dead) continue` at the top: a hole that was already consumed earlier in
   *       THIS tick cannot then turn around and eat someone. Previously a rival could be
   *       marked dead and still run its own eat pass in the same frame.
   *
   * Entities are only flagged; the arrays are compacted afterwards in compact().
   */
  resolveEating() {
    const { EAT_RATIO, EAT_OVERLAP } = CFG.PHYSICS;
    const holes = this.players.slice().sort((a, b) => b.mass - a.mass);   // (a) snapshot, biggest first

    for (const H of holes) {
      if (H.dead) continue;                                               // (b) eaten holes don't eat

      const tryEat = (B) => {
        if (B === H || B.dead) return;                                    // already consumed this tick
        if (B.shield > 0) return;                                         // spawn protection
        if (H.mass < B.mass * EAT_RATIO) return;
        const d = Math.hypot(B.x - H.x, B.y - H.y);
        if (d > H.r * EAT_OVERLAP + B.r * 0.25) return;

        B.dead = true;
        H.consume(B);
        this.spawnAbsorption(B, H);
        this.events.push({ type: "absorb", x: B.x, y: B.y, r: B.r, hole: H, victim: B });

        if (B.type === "player") {
          this.feed.unshift({ a: H.name, b: B.name, mine: H === this.local, victimIsMe: B === this.local, t: 6 });
          if (this.feed.length > 6) this.feed.length = 6;
          if (B === this.local) this.killLocal(H);
        }
      };

      for (const B of this.food) tryEat(B);
      for (const B of holes) tryEat(B);
    }
  }

  spawnAbsorption(victim, hole) {
    const n = clamp(Math.round(6 + victim.r * 1.15), 6, 64);
    for (let i = 0; i < n; i++) {
      const a = rand(0, TAU), sp = rand(50, 60 + victim.r * 9);
      this.particles.push(new Particle(
        victim.x + Math.cos(a) * victim.r * 0.5,
        victim.y + Math.sin(a) * victim.r * 0.5,
        Math.cos(a) * sp + hole.vx * 0.5,
        Math.sin(a) * sp + hole.vy * 0.5,
        rand(0.25, 0.8),
        rand(1, 2.6) + victim.r * 0.06,
        victim.tint || victim.color || "#fff"
      ));
    }
  }

  compact() {
    if (this.food.some(e => e.dead)) this.food = this.food.filter(e => !e.dead);
    if (this.players.some(p => p.dead)) this.players = this.players.filter(p => !p.dead);
    if (this.particles.some(p => p.dead)) this.particles = this.particles.filter(p => !p.dead);
  }

  /** A point far from anything that could immediately eat `who`. */
  safeSpawn(who) {
    const W = this.world.w, H = this.world.h;
    let best = { x: W / 2, y: H / 2 }, bestD = -Infinity;
    for (let i = 0; i < 24; i++) {
      const x = rand(200, W - 200), y = rand(200, H - 200);
      let nearest = Infinity;
      for (const p of this.players) {
        if (p === who || p.dead) continue;
        if (who && p.mass < who.mass) continue;
        nearest = Math.min(nearest, Math.hypot(p.x - x, p.y - y) - p.influence);
      }
      if (nearest === Infinity || nearest > 700) return { x, y };
      if (nearest > bestD) { bestD = nearest; best = { x, y }; }
    }
    return best;
  }

  repopulate() {
    const counts = { dust: 0, asteroid: 0, planet: 0 };
    for (const e of this.food) counts[e.type]++;

    const away = () => {
      const anchor = this.state === "dead" ? this.deathCam : this.local;
      for (let i = 0; i < 8; i++) {
        const x = rand(0, this.world.w), y = rand(0, this.world.h);
        if (!anchor || Math.hypot(x - anchor.x, y - anchor.y) > anchor.influence * 1.6) return { x, y };
      }
      return { x: rand(0, this.world.w), y: rand(0, this.world.h) };
    };

    while (counts.dust < CFG.COUNTS.dust)          { const p = away(); this.food.push(new Dust(p.x, p.y)); counts.dust++; }
    while (counts.asteroid < CFG.COUNTS.asteroids) { const p = away(); this.food.push(new Asteroid(p.x, p.y)); counts.asteroid++; }
    while (counts.planet < CFG.COUNTS.planets)     { const p = away(); this.food.push(new Planet(p.x, p.y)); counts.planet++; }

    const wanted = CFG.COUNTS.bots + (this.state === "playing" ? 1 : 0);
    let guard = 0;
    while (this.players.length < wanted && guard++ < 4) this.spawnBot(null);
  }
}


/* ==========================================================================================
   8. RENDERER
   ========================================================================================== */
class Renderer {
  constructor(canvas, camera) {
    this.canvas = canvas;
    this.ctx = canvas.getContext("2d", { alpha: false });
    this.camera = camera;
    this.dpr = 1;
    this.stars = [];
    this.buildStarfield();
    this.resize();
    window.addEventListener("resize", () => this.resize());
  }

  resize() {
    this.dpr = Math.min(window.devicePixelRatio || 1, 2);   // cap: this scene is fill-rate heavy
    const w = window.innerWidth, h = window.innerHeight;
    this.canvas.width = Math.floor(w * this.dpr);
    this.canvas.height = Math.floor(h * this.dpr);
    this.canvas.style.width = w + "px";
    this.canvas.style.height = h + "px";
    this.camera.resize(w, h);
    this.ctx.setTransform(1, 0, 0, 1, 0, 0);
    this.ctx.fillStyle = "#000";
    this.ctx.fillRect(0, 0, this.canvas.width, this.canvas.height);
  }

  buildStarfield() {
    this.stars = CFG.RENDER.STAR_LAYERS.map(layer => {
      const pts = [], TILE = 2600;
      for (let i = 0; i < layer.count; i++) {
        pts.push({
          x: rand(0, TILE), y: rand(0, TILE),
          s: layer.size * rand(0.5, 1.5),
          a: layer.alpha * rand(0.4, 1),
          tw: rand(0, TAU),
          c: chance(0.86) ? "#ffffff" : pick(["#bcd8ff", "#ffd9bc", "#d8bcff"])
        });
      }
      return { pts, speed: layer.speed, tile: TILE };
    });
  }

  draw(game) {
    const ctx = this.ctx, cam = this.camera;

    // ---- 1. TRAIL FADE: translucent black instead of clearRect => motion blur ----
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.globalCompositeOperation = "source-over";
    ctx.fillStyle = "rgba(2, 2, 8, " + CFG.RENDER.TRAIL_FADE + ")";
    ctx.fillRect(0, 0, this.canvas.width, this.canvas.height);

    // ---- 2. PARALLAX STARFIELD (screen space) ----
    this.drawStars(game.time);

    // ---- 3. WORLD TRANSFORM: screen = (world - cam) * zoom + centre + shake ----
    ctx.setTransform(this.dpr, 0, 0, this.dpr, 0, 0);
    ctx.translate(cam.vw / 2 + cam.shx, cam.vh / 2 + cam.shy);
    ctx.scale(cam.zoom, cam.zoom);
    ctx.translate(-cam.x, -cam.y);

    const vb = cam.viewBounds(260);
    this.drawWorldBounds(ctx);

    ctx.globalCompositeOperation = "lighter";
    for (const e of game.food) {
      if (e.x < vb.x0 || e.x > vb.x1 || e.y < vb.y0 || e.y > vb.y1) continue;
      if (e.type === "dust") this.drawDust(ctx, e, game.time);
    }
    ctx.globalCompositeOperation = "source-over";
    for (const e of game.food) {
      if (e.x < vb.x0 || e.x > vb.x1 || e.y < vb.y0 || e.y > vb.y1) continue;
      if (e.type === "asteroid") this.drawAsteroid(ctx, e);
      else if (e.type === "planet") this.drawPlanet(ctx, e);
    }

    ctx.globalCompositeOperation = "lighter";
    for (const p of game.particles) this.drawParticle(ctx, p);
    ctx.globalCompositeOperation = "source-over";

    const holes = game.players.slice().sort((a, b) => a.r - b.r);   // small first
    for (const p of holes) this.drawBlackHole(ctx, p, game.time);

    ctx.setTransform(this.dpr, 0, 0, this.dpr, 0, 0);
    this.drawVignette(ctx, cam.vw, cam.vh);
    this.drawMinimap(ctx, game);
  }

  /** Depth layers offset by camera * their own speed, wrapped modulo a tile. */
  drawStars(time) {
    const ctx = this.ctx, cam = this.camera;
    ctx.setTransform(this.dpr, 0, 0, this.dpr, 0, 0);
    ctx.globalCompositeOperation = "lighter";

    for (const layer of this.stars) {
      const tile = layer.tile;
      const zk = 0.55 + cam.zoom * 0.45;
      let ox = -(cam.x * layer.speed * zk) % tile;
      let oy = -(cam.y * layer.speed * zk) % tile;
      if (ox > 0) ox -= tile;
      if (oy > 0) oy -= tile;
      const cols = Math.ceil(cam.vw / tile) + 1, rows = Math.ceil(cam.vh / tile) + 1;

      for (let cx = 0; cx <= cols; cx++) {
        for (let cy = 0; cy <= rows; cy++) {
          const bx = ox + cx * tile, by = oy + cy * tile;
          for (let i = 0; i < layer.pts.length; i++) {
            const s = layer.pts[i];
            const x = bx + s.x, y = by + s.y;
            if (x < -4 || x > cam.vw + 4 || y < -4 || y > cam.vh + 4) continue;
            const tw = 0.72 + 0.28 * Math.sin(time * 1.7 + s.tw);
            ctx.globalAlpha = s.a * tw;
            ctx.fillStyle = s.c;
            const sz = s.s * (0.7 + layer.speed);
            ctx.fillRect(x, y, sz, sz);
          }
        }
      }
    }
    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = "source-over";
  }

  drawWorldBounds(ctx) {
    ctx.save();
    ctx.strokeStyle = "rgba(70,120,190,0.30)";
    ctx.lineWidth = 3 / this.camera.zoom;
    ctx.shadowBlur = 26; ctx.shadowColor = "rgba(70,140,255,0.55)";
    ctx.strokeRect(0, 0, CFG.WORLD.w, CFG.WORLD.h);
    ctx.restore();
  }

  drawDust(ctx, e, time) {
    const tw = 0.65 + 0.35 * Math.sin(time * 3.1 + e.twinkle);
    ctx.save();
    ctx.translate(e.x, e.y);
    ctx.rotate(e.stretchAng);                    // long axis points at the singularity
    ctx.scale(e.stretch, 1 / Math.sqrt(e.stretch));   // area-preserving stretch
    ctx.globalAlpha = 0.9 * tw;
    ctx.fillStyle = e.tint;
    ctx.shadowBlur = 12; ctx.shadowColor = e.tint;
    ctx.beginPath(); ctx.arc(0, 0, e.r, 0, TAU); ctx.fill();
    ctx.globalAlpha = 0.28 * tw;
    ctx.beginPath(); ctx.arc(0, 0, e.r * 2.6, 0, TAU); ctx.fill();
    ctx.restore();
    ctx.globalAlpha = 1;
  }

  drawAsteroid(ctx, e) {
    ctx.save();
    ctx.translate(e.x, e.y);
    ctx.rotate(e.stretchAng);
    ctx.scale(e.stretch, 1 / Math.sqrt(e.stretch));
    ctx.rotate(e.angle - e.stretchAng);          // own tumble, under the stretch frame

    const n = e.lumps.length;
    ctx.beginPath();
    for (let i = 0; i <= n; i++) {
      const a = (i % n) / n * TAU, rr = e.r * e.lumps[i % n];
      const x = Math.cos(a) * rr, y = Math.sin(a) * rr;
      if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    }
    ctx.closePath();

    const g = ctx.createRadialGradient(-e.r * 0.35, -e.r * 0.35, e.r * 0.1, 0, 0, e.r * 1.25);
    g.addColorStop(0, "#d8cfc0"); g.addColorStop(0.42, e.tint); g.addColorStop(1, "#14161c");
    ctx.fillStyle = g; ctx.fill();
    ctx.strokeStyle = "rgba(190,210,255,0.20)";
    ctx.lineWidth = Math.max(0.6, e.r * 0.07);
    ctx.stroke();

    if (e.stretch > 1.25) {                      // glows hot while being torn apart
      ctx.globalCompositeOperation = "lighter";
      ctx.globalAlpha = clamp((e.stretch - 1.25) / 2.6, 0, 0.85);
      ctx.strokeStyle = "#ffb06a";
      ctx.shadowBlur = 18; ctx.shadowColor = "#ff8a3a";
      ctx.stroke();
    }
    ctx.restore();
    ctx.globalAlpha = 1;
  }

  drawPlanet(ctx, e) {
    ctx.save();
    ctx.translate(e.x, e.y);
    ctx.rotate(e.stretchAng);
    ctx.scale(e.stretch, 1 / Math.sqrt(e.stretch));

    if (e.hasRing) {
      ctx.save();
      ctx.rotate(e.ringTilt);
      ctx.scale(1, 0.26);
      ctx.strokeStyle = "rgba(220,210,190,0.42)"; ctx.lineWidth = e.r * 0.16;
      ctx.beginPath(); ctx.arc(0, 0, e.r * 1.62, 0, TAU); ctx.stroke();
      ctx.strokeStyle = "rgba(220,210,190,0.20)"; ctx.lineWidth = e.r * 0.07;
      ctx.beginPath(); ctx.arc(0, 0, e.r * 1.92, 0, TAU); ctx.stroke();
      ctx.restore();
    }

    const g = ctx.createRadialGradient(-e.r * 0.4, -e.r * 0.42, e.r * 0.08, 0, 0, e.r * 1.05);
    g.addColorStop(0, e.pal[1]); g.addColorStop(0.5, e.pal[0]); g.addColorStop(1, e.pal[2]);
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(0, 0, e.r, 0, TAU); ctx.fill();

    ctx.save();                                   // latitude bands, clipped to the disc
    ctx.beginPath(); ctx.arc(0, 0, e.r, 0, TAU); ctx.clip();
    ctx.rotate(e.angle);
    ctx.globalAlpha = 0.16; ctx.fillStyle = e.pal[2];
    for (let i = -3; i <= 3; i++) ctx.fillRect(-e.r, i * e.r * 0.3, e.r * 2, e.r * 0.12);
    ctx.restore();

    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = "lighter";     // atmospheric limb glow
    const ag = ctx.createRadialGradient(0, 0, e.r * 0.88, 0, 0, e.r * 1.3);
    ag.addColorStop(0, "rgba(0,0,0,0)");
    ag.addColorStop(0.55, "rgba(150,200,255,0.16)");
    ag.addColorStop(1, "rgba(0,0,0,0)");
    ctx.fillStyle = ag;
    ctx.beginPath(); ctx.arc(0, 0, e.r * 1.3, 0, TAU); ctx.fill();
    ctx.restore();
    ctx.globalCompositeOperation = "source-over";
    ctx.globalAlpha = 1;
  }

  drawParticle(ctx, p) {
    const t = p.life / p.maxLife;
    ctx.globalAlpha = t * t;
    ctx.fillStyle = p.color;
    ctx.shadowBlur = 14; ctx.shadowColor = p.color;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.size * (0.35 + t * 0.65), 0, TAU); ctx.fill();
    ctx.globalAlpha = 1; ctx.shadowBlur = 0;
  }

  /**
   * BLACK HOLE, back to front:
   *   lensing halo -> comet trail -> accretion disk -> photon ring -> event horizon
   *   -> absorb shockwave -> spawn shield -> nameplate
   */
  drawBlackHole(ctx, p, time) {
    const r = p.r;
    const pulse = 1 + 0.055 * Math.sin(p.pulse * 1.6) + 0.03 * Math.sin(p.pulse * 3.7);

    // lensing halo
    ctx.save();
    ctx.globalCompositeOperation = "lighter";
    const haloR = r * 6.2;
    const halo = ctx.createRadialGradient(p.x, p.y, r * 0.9, p.x, p.y, haloR);
    halo.addColorStop(0.00, this.rgba(p.color, 0.30));
    halo.addColorStop(0.16, this.rgba(p.color, 0.13));
    halo.addColorStop(0.45, "rgba(60,90,190,0.055)");
    halo.addColorStop(1.00, "rgba(0,0,0,0)");
    ctx.fillStyle = halo;
    ctx.beginPath(); ctx.arc(p.x, p.y, haloR, 0, TAU); ctx.fill();
    ctx.restore();

    // comet trail
    const tr = p.trail;
    if (tr.length >= 6) {
      ctx.save();
      ctx.globalCompositeOperation = "lighter";
      const pts = tr.length / 2;
      ctx.lineCap = "round"; ctx.strokeStyle = p.color;
      for (let i = 0; i < pts - 1; i++) {
        const a = i / pts;
        ctx.globalAlpha = a * a * 0.30;
        ctx.lineWidth = r * 1.5 * a;
        ctx.beginPath();
        ctx.moveTo(tr[i * 2], tr[i * 2 + 1]);
        ctx.lineTo(tr[i * 2 + 2], tr[i * 2 + 3]);
        ctx.stroke();
      }
      ctx.restore();
    }

    // accretion disk
    ctx.save();
    ctx.translate(p.x, p.y);
    ctx.globalCompositeOperation = "lighter";
    ctx.rotate(p.diskAngle);
    const diskR = r * 2.55 * pulse;
    const disk = ctx.createRadialGradient(0, 0, r * 0.92, 0, 0, diskR);
    disk.addColorStop(0.00, "rgba(255,255,255,0.96)");
    disk.addColorStop(0.13, this.rgba(p.color, 0.92));
    disk.addColorStop(0.38, this.rgba(p.color, 0.42));
    disk.addColorStop(0.70, "rgba(120,70,220,0.16)");
    disk.addColorStop(1.00, "rgba(0,0,0,0)");
    ctx.fillStyle = disk;
    ctx.shadowBlur = clamp(r * 1.6, 18, 130); ctx.shadowColor = p.color;
    ctx.beginPath(); ctx.arc(0, 0, diskR, 0, TAU); ctx.fill();

    ctx.shadowBlur = clamp(r * 0.9, 10, 70);      // Doppler-beamed hot arcs = visible spin
    for (let k = 0; k < 2; k++) {
      const a0 = k * Math.PI + Math.sin(time * 0.7 + k) * 0.25;
      ctx.globalAlpha = 0.42;
      ctx.strokeStyle = k === 0 ? "#ffffff" : p.color;
      ctx.lineWidth = r * 0.30;
      ctx.beginPath(); ctx.arc(0, 0, r * (1.42 + k * 0.34), a0, a0 + 1.15); ctx.stroke();
    }
    ctx.globalAlpha = 1;
    ctx.restore();

    // photon ring
    ctx.save();
    ctx.globalCompositeOperation = "lighter";
    ctx.strokeStyle = "#ffffff"; ctx.globalAlpha = 0.85;
    ctx.lineWidth = Math.max(0.8, r * 0.055);
    ctx.shadowBlur = clamp(r * 1.1, 12, 90); ctx.shadowColor = p.color;
    ctx.beginPath(); ctx.arc(p.x, p.y, r * 1.045, 0, TAU); ctx.stroke();
    ctx.restore();

    // event horizon: painted source-over so it genuinely occludes the additive layers
    ctx.save();
    ctx.globalCompositeOperation = "source-over";
    ctx.fillStyle = "#000000";
    ctx.beginPath(); ctx.arc(p.x, p.y, r, 0, TAU); ctx.fill();
    const inner = ctx.createRadialGradient(p.x, p.y, r * 0.55, p.x, p.y, r);
    inner.addColorStop(0, "rgba(0,0,0,1)"); inner.addColorStop(1, "rgba(12,6,26,1)");
    ctx.fillStyle = inner;
    ctx.beginPath(); ctx.arc(p.x, p.y, r, 0, TAU); ctx.fill();
    ctx.restore();

    // absorb shockwave
    if (p.eatFlash > 0.01) {
      ctx.save();
      ctx.globalCompositeOperation = "lighter";
      const f = 1 - p.eatFlash;
      ctx.globalAlpha = p.eatFlash * 0.7;
      ctx.strokeStyle = "#ffffff";
      ctx.lineWidth = Math.max(1, r * 0.16 * p.eatFlash);
      ctx.shadowBlur = 30; ctx.shadowColor = p.color;
      ctx.beginPath(); ctx.arc(p.x, p.y, r * (1.1 + f * 2.4), 0, TAU); ctx.stroke();
      ctx.restore();
    }

    // spawn shield
    if (p.shield > 0) {
      ctx.save();
      ctx.globalCompositeOperation = "lighter";
      const a = clamp(p.shield / CFG.PLAYER.SPAWN_SHIELD, 0, 1);
      ctx.globalAlpha = 0.22 + 0.30 * a * (0.6 + 0.4 * Math.sin(time * 9));
      ctx.strokeStyle = "#9fd8ff";
      ctx.lineWidth = Math.max(1, r * 0.10);
      ctx.setLineDash([r * 0.55, r * 0.4]);
      ctx.lineDashOffset = -time * r * 1.4;
      ctx.shadowBlur = 22; ctx.shadowColor = "#5aa0ff";
      ctx.beginPath(); ctx.arc(p.x, p.y, r * 2.0, 0, TAU); ctx.stroke();
      ctx.restore();
    }

    // nameplate
    ctx.save();
    const fs = Math.max(11 / this.camera.zoom, r * 0.42);
    ctx.font = "500 " + fs.toFixed(1) + "px ui-monospace, Menlo, monospace";
    ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.globalAlpha = p.isLocal ? 0.95 : 0.6;
    ctx.fillStyle = p.isLocal ? "#ffffff" : "#cfe4ff";
    ctx.shadowBlur = 12; ctx.shadowColor = "#000";
    ctx.fillText(p.name, p.x, p.y + r + fs * 1.25);
    ctx.restore();
    ctx.globalAlpha = 1; ctx.shadowBlur = 0;
  }

  drawVignette(ctx, w, h) {
    const g = ctx.createRadialGradient(w / 2, h / 2, Math.min(w, h) * 0.34, w / 2, h / 2, Math.max(w, h) * 0.78);
    g.addColorStop(0, "rgba(0,0,0,0)");
    g.addColorStop(1, "rgba(0,0,0,0.62)");
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, w, h);
  }

  /** Bottom-right minimap: 5000x5000 is far too big to navigate blind. */
  drawMinimap(ctx, game) {
    const S = 132, pad = 16;
    const x0 = this.camera.vw - S - pad, y0 = this.camera.vh - S - pad;
    const k = S / CFG.WORLD.w;

    ctx.save();
    ctx.globalAlpha = 0.82;
    ctx.fillStyle = "rgba(3,8,16,0.62)";
    ctx.fillRect(x0, y0, S, S);
    ctx.strokeStyle = "rgba(70,120,190,0.42)";
    ctx.lineWidth = 1;
    ctx.strokeRect(x0 + 0.5, y0 + 0.5, S - 1, S - 1);

    for (const e of game.food) {                  // planets only — dust would be mush
      if (e.type !== "planet") continue;
      ctx.fillStyle = "rgba(150,180,220,0.5)";
      ctx.beginPath(); ctx.arc(x0 + e.x * k, y0 + e.y * k, 1.8, 0, TAU); ctx.fill();
    }
    for (const p of game.players) {
      const isMe = p.isLocal;
      ctx.fillStyle = isMe ? "#ffb45e" : p.color;
      ctx.globalAlpha = isMe ? 1 : 0.75;
      ctx.beginPath();
      ctx.arc(x0 + p.x * k, y0 + p.y * k, clamp(p.r * k * 2.2, 1.6, 5), 0, TAU);
      ctx.fill();
    }

    ctx.globalAlpha = 0.55;                        // viewport rectangle
    const vb = this.camera.viewBounds(0);
    ctx.strokeStyle = "#ffffff"; ctx.lineWidth = 1;
    ctx.strokeRect(x0 + vb.x0 * k, y0 + vb.y0 * k, (vb.x1 - vb.x0) * k, (vb.y1 - vb.y0) * k);
    ctx.restore();
    ctx.globalAlpha = 1;
  }

  rgba(hex, a) {
    const n = parseInt(hex.slice(1), 16);
    return "rgba(" + ((n >> 16) & 255) + "," + ((n >> 8) & 255) + "," + (n & 255) + "," + a + ")";
  }
}


/* ==========================================================================================
   9. HUD
   ========================================================================================== */
class HUD {
  constructor() {
    const $ = id => document.getElementById(id);
    this.mass = $("ui-mass"); this.x = $("ui-x"); this.y = $("ui-y");
    this.fps = $("ui-fps"); this.ent = $("ui-ent");
    this.time = $("ui-time"); this.eaten = $("ui-eaten");
    this.board = $("ui-board"); this.feed = $("feed");
    this.acc = 0; this.lastFeed = 0;
  }

  update(game, fps, dt) {
    this.acc += dt;
    if (this.acc < 0.1) return;                    // throttle DOM writes to 10Hz
    this.acc = 0;

    const me = game.local;
    const live = me && game.state === "playing";
    this.mass.textContent = me ? fmt(live ? me.mass : me.peakMass) : "0";
    this.x.textContent = me ? Math.round(me.x) : 0;
    this.y.textContent = me ? Math.round(me.y) : 0;
    this.fps.textContent = Math.round(fps);
    this.ent.textContent = game.food.length + game.players.length + game.particles.length;
    this.time.textContent = live ? mmss(game.time - me.spawnTime) : "0:00";
    this.eaten.textContent = me ? me.absorbed : 0;

    const top = (game.ranked || game.players).slice(0, 7);
    this.board.innerHTML = top.map((p, i) =>
      '<div class="' + (p.isLocal ? "me" : "") + '">' + (i + 1) + ". " + esc(p.name) + " &nbsp;" + fmt(p.mass) + "</div>"
    ).join("");

    if (game.feed.length !== this.lastFeed) {
      this.lastFeed = game.feed.length;
      this.feed.innerHTML = game.feed.map(f =>
        '<div class="' + (f.mine ? "mine" : "") + '">' +
        '<span class="ate">' + esc(f.a) + '</span> devoured ' +
        '<span class="victim">' + esc(f.b) + '</span></div>'
      ).join("");
    }
  }
}
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));


/* ==========================================================================================
   10. BOOTSTRAP + MAIN LOOP
   ========================================================================================== */
(function main() {
  const $ = id => document.getElementById(id);
  const canvas = $("game");
  const camera = new Camera();
  const input = new Input();
  const renderer = new Renderer(canvas, camera);
  const hud = new HUD();
  const audio = new GameAudio();

  const game = new Game(audio);
  game.init();
  const localController = new LocalMouseController(input, camera);

  const menuEl = $("menu"), deathEl = $("death"), nameEl = $("name"), soundEl = $("sound");

  // Attract mode: park the camera on the biggest hole so the menu sits over live gameplay.
  const attractTarget = () => (game.ranked && game.ranked[0]) || game.players[0];
  camera.hard = false;
  const a0 = attractTarget();
  if (a0) { camera.x = a0.x; camera.y = a0.y; }

  // ---------------- UI wiring ----------------
  function startGame() {
    audio.unlock();
    audio.ui();
    const name = (nameEl.value || "").trim().slice(0, 12) || "YOU";
    menuEl.classList.add("gone");
    deathEl.classList.add("gone");
    camera.hard = true;
    game.spawnLocal(name.toUpperCase(), localController);
    camera.x = game.local.x; camera.y = game.local.y;
  }

  $("play").addEventListener("click", startGame);
  $("respawn").addEventListener("click", startGame);
  nameEl.addEventListener("keydown", e => { if (e.key === "Enter") startGame(); });
  window.addEventListener("keydown", e => {
    if ((e.code === "Space" || e.code === "Enter") && game.state === "dead") { e.preventDefault(); startGame(); }
  });

  soundEl.addEventListener("click", () => {
    audio.unlock();
    const on = !audio.enabled;
    audio.setEnabled(on);
    soundEl.textContent = on ? "SOUND ON" : "SOUND OFF";
    soundEl.classList.toggle("off", !on);
    if (on) audio.ui();
  });

  // Pause when the tab is hidden so we don't burn CPU or bank up a huge dt.
  let hidden = false;
  document.addEventListener("visibilitychange", () => {
    hidden = document.hidden;
    if (!hidden) last = performance.now();
  });

  function showDeath() {
    const d = game.deathInfo;
    $("d-killer").textContent = d.killer;
    $("d-mass").textContent = fmt(d.peakMass);
    $("d-rank").textContent = "#" + (d.rank === 99 ? "—" : d.rank);
    $("d-time").textContent = mmss(d.time);
    $("d-eaten").textContent = d.absorbed;
    deathEl.classList.remove("gone");
  }

  // ---------------- Fixed-timestep loop ----------------
  // Render runs at display rate; the sim always advances in FIXED_DT chunks, so physics is
  // identical at 60Hz and 240Hz — the same stepping model the authoritative server will use.
  let acc = 0, last = performance.now();
  let fps = 60, fpsAcc = 0, fpsFrames = 0;
  let deathDelay = 0;

  function frame(now) {
    requestAnimationFrame(frame);
    let dt = (now - last) / 1000;
    last = now;
    if (hidden || !isFinite(dt) || dt <= 0) return;
    dt = Math.min(dt, CFG.PHYSICS.MAX_FRAME_DT);

    fpsAcc += dt; fpsFrames++;
    if (fpsAcc >= 0.25) { fps = fpsFrames / fpsAcc; fpsAcc = 0; fpsFrames = 0; }

    // --- SIMULATE ---
    acc += dt;
    let steps = 0;
    while (acc >= CFG.PHYSICS.FIXED_DT && steps < 8) {   // 8 = spiral-of-death guard
      game.step(CFG.PHYSICS.FIXED_DT);
      acc -= CFG.PHYSICS.FIXED_DT;
      steps++;
    }
    if (steps === 8) acc = 0;

    // --- DRAIN SIM EVENTS into audio / camera / UI ---
    const listener = game.state === "dead" ? game.deathCam : game.local;
    for (const ev of game.events) {
      if (ev.type === "absorb") {
        const d = listener ? Math.hypot(ev.x - listener.x, ev.y - listener.y) : null;
        audio.absorb(ev.r, d, camera.viewRadius, ev.victim && ev.victim.type === "player");
        if (ev.hole === game.local) camera.kick(clamp(ev.r / 90, 0.04, 0.9));
      } else if (ev.type === "death") {
        audio.death();
        camera.kick(1.4);
        camera.hard = false;
        deathDelay = 1.15;                 // let the kill land before the UI covers it
      } else if (ev.type === "spawn") {
        audio.spawn();
      }
    }
    game.events.length = 0;

    if (deathDelay > 0) {
      deathDelay -= dt;
      if (deathDelay <= 0 && game.state === "dead") showDeath();
    }

    // --- CAMERA ---
    let camTarget;
    if (game.state === "playing") camTarget = game.local;
    else if (game.state === "dead") {
      if (game.deathCam && game.deathCam.dead) game.deathCam = null;   // our killer got eaten too
      camTarget = game.deathCam || attractTarget();
    }
    else camTarget = attractTarget();
    camera.follow(camTarget, dt);

    renderer.draw(game);
    hud.update(game, fps, dt);
  }

  requestAnimationFrame(frame);
  window.BLACKHOLE = { game, camera, renderer, audio, CFG };
})();
</script>
